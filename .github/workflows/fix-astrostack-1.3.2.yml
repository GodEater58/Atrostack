name: Build and install-test AstroStack 1.3.2
'on':
  workflow_dispatch: null
  push:
    paths:
    - .github/workflows/fix-astrostack-1.3.2.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Prepare isolated runtime fix 1.3.2
      shell: python
      run: |
        from pathlib import Path
        import base64
        files = {'source/setup/install_offline.ps1': '', 'source/setup/main.go': '', 'source/build_offline.ps1': '', 'source/app/astrostack/__init__.py': 'IiIiQXN0cm9TdGFjay4iIiINCl9fdmVyc2lvbl9fID0gIjEuMy4yLXByZXZpZXciDQo=', 'source/app/verify_runtime.py': '', 'source/app/tests/smoke_gui.py': '', 'source/app/tests/verify_installation.ps1': ''}
        for name, data in files.items():
            path = Path(name)
            path.parent.mkdir(parents=True, exist_ok=True)
            path.write_bytes(base64.b64decode(data))
    - name: PowerShell syntax, encoding and process regression
      shell: powershell
      run: |
        $ErrorActionPreference = 'Stop'
        foreach ($path in @('source/setup/install_offline.ps1', 'source/build_offline.ps1')) {
          $tokens = $null
          $parseErrors = $null
          $ast = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          if ($path -like '*/setup/*') { $installerAst = $ast }
        }
        # Load only the real function, without installer UI or side effects.
        $functions = @($installerAst.FindAll({ param($node)
          $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq 'Run-Process'
        }, $true))
        if ($functions.Count -ne 1) { throw 'Expected exactly one Run-Process function.' }
        . ([scriptblock]::Create($functions[0].Extent.Text))
        # A null ArgumentList fails here; the nonzero case also proves forwarding.
        Run-Process $env:ComSpec @('/d', '/c', 'exit', '0')
        $caught = $false
        try { Run-Process $env:ComSpec @('/d', '/c', 'exit', '7') }
        catch {
          if ($_.Exception.Message -notmatch 'codice 7\.') { throw }
          $caught = $true
        }
        if (-not $caught) { throw 'Run-Process did not propagate exit code 7.' }
        Write-Host 'ASTROSTACK_INSTALLER_RUN_PROCESS_OK'

        $bytes = [IO.File]::ReadAllBytes((Resolve-Path 'source/setup/install_offline.ps1'))
        if ($bytes[0] -ne 239 -or $bytes[1] -ne 187 -or $bytes[2] -ne 191) { throw 'UTF-8 BOM required.' }
    - name: Controllo sintassi Python
      shell: powershell
      run: |
        python -m py_compile `
          ".\source\app\main.py" `
          ".\source\app\astrostack\__init__.py" `
          ".\source\app\astrostack\gui\main_window.py" `
          ".\source\app\astrostack\gui\ux_v13.py"
    - name: Installa dipendenze test
      shell: powershell
      run: |
        python -m pip install `
          --disable-pip-version-check `
          -r ".\source\app\requirements.txt"
    - name: GUI smoke test from sources
      shell: powershell
      env:
        QT_QPA_PLATFORM: offscreen
      run: python source/app/tests/smoke_gui.py
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.23.x
    - name: Prepara Go
      shell: powershell
      run: |
        Push-Location ".\source\launcher"

        if (-not (Test-Path "go.mod")) {
          go mod init astrostack-launcher
        }

        Pop-Location

        Push-Location ".\source\setup"

        if (-not (Test-Path "go.mod")) {
          go mod init astrostack-setup
        }

        Pop-Location
    - name: Build private offline runtime and installer
      shell: powershell
      run: '& ./source/build_offline.ps1 -Version "1.3.2_preview"'
    - name: Install registered Python 3.12.10 coexistence fixture
      shell: powershell
      run: |
        $ErrorActionPreference = 'Stop'
        $fixture = Join-Path $env:RUNNER_TEMP 'python-existing.exe'
        Invoke-WebRequest -Uri 'https://www.python.org/ftp/python/3.12.10/python-3.12.10-amd64.exe' -OutFile $fixture
        $p = Start-Process -FilePath $fixture -ArgumentList '/quiet','InstallAllUsers=0','Include_launcher=0','Include_dev=1','Include_tcltk=1','Include_test=0','PrependPath=0' -Wait -PassThru -WindowStyle Hidden
        if ($p.ExitCode -ne 0) { throw "Fixture install failed: $($p.ExitCode)" }
    - name: Test complete installer, reinstall and existing Python preservation
      shell: powershell
      run: '& ./source/app/tests/verify_installation.ps1'
    - name: Save verified source fixes
      shell: powershell
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add source/setup/install_offline.ps1 source/setup/main.go source/build_offline.ps1 source/app/astrostack/__init__.py source/app/verify_runtime.py source/app/tests/smoke_gui.py source/app/tests/verify_installation.ps1
        if (git diff --cached --name-only) {
            git commit -m "Fix AstroStack 1.3.2 with isolated Python runtime and installation regression tests"
            if ($LASTEXITCODE) { throw "Commit failed" }
            git push
            if ($LASTEXITCODE) { throw "Push failed" }
        }
    - name: Upload verified offline installer
      uses: actions/upload-artifact@v4
      with:
        name: AstroStack-1.3.2-preview-verified-offline-windows
        path: |-
          source/AstroStack_Setup_Offline_1.3.2_preview.exe
          source/AstroStack_Setup_Offline_1.3.2_preview.exe.sha256.txt
        if-no-files-found: error
        compression-level: 0
