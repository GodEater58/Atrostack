name: Build Windows portable ZIP

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Portable package version label'
        required: false
        default: '1.4.0_preview'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'
          } else {
            $version = '${{ github.ref_name }}'.TrimStart('v').Replace('-', '_')
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build portable ZIP
        shell: pwsh
        env:
          GO111MODULE: 'off'
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        run: ./source/build_portable.ps1 -Version '${{ steps.version.outputs.value }}'

      - name: Verify package files
        shell: pwsh
        run: |
          $zip = Get-ChildItem source/AstroStack_*_Windows_x64.zip | Select-Object -First 1
          $sha = Get-ChildItem source/AstroStack_*_Windows_x64.zip.sha256.txt | Select-Object -First 1
          if (-not $zip -or -not $sha) { throw 'Portable ZIP or checksum missing.' }
          Write-Host "ZIP: $($zip.FullName)"
          Write-Host "Checksum: $($sha.FullName)"

      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: AstroStack-Windows-Portable-${{ steps.version.outputs.value }}
          path: |
            source/AstroStack_*_Windows_x64.zip
            source/AstroStack_*_Windows_x64.zip.sha256.txt
          if-no-files-found: error

      - name: Publish GitHub Release for tags
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' `
            source/AstroStack_*_Windows_x64.zip `
            source/AstroStack_*_Windows_x64.zip.sha256.txt `
            --title 'AstroStack ${{ github.ref_name }}' `
            --generate-notes
