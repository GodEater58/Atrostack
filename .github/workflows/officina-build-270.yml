name: Officina Stock 2.7.0 build

on:
  push:
    branches: [officina-build-270]
    paths:
      - 'officina270/**'
      - '.github/workflows/officina-build-270.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build release APK
        working-directory: officina270
        run: gradle --no-daemon assembleRelease

      - name: Align APK and collect signer
        run: |
          mkdir -p artifact
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4             officina270/app/build/outputs/apk/release/app-release-unsigned.apk             artifact/Officina_Stock_2.7.0_unsigned_aligned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" artifact/apksigner.jar
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id artifact/Officina_Stock_2.7.0_unsigned_aligned.apk || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest version-name artifact/Officina_Stock_2.7.0_unsigned_aligned.apk || true

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: OfficinaStock-2.7.0-build
          path: artifact/
          retention-days: 1
