name: Extract structured AstroStack source

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/extract-structured-source.yml'
      - 'AstroStack_Offline_Builder_1.2.0_preview.zip'

permissions:
  contents: write

jobs:
  extract:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Estrai builder
        shell: powershell
        run: |
          Expand-Archive `
            -Path ".\AstroStack_Offline_Builder_1.2.0_preview.zip" `
            -DestinationPath ".\builder" `
            -Force

      - name: Pubblica sorgenti
        shell: powershell
        run: |
          if (Test-Path ".\source") {
            Remove-Item ".\source" -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path ".\source" | Out-Null

          Copy-Item ".\builder\app" ".\source\app" -Recurse -Force
          Copy-Item ".\builder\launcher" ".\source\launcher" -Recurse -Force
          Copy-Item ".\builder\setup" ".\source\setup" -Recurse -Force
          Copy-Item ".\builder\build_offline.ps1" ".\source\build_offline.ps1" -Force
          Copy-Item ".\builder\README_OFFLINE.md" ".\source\README_OFFLINE.md" -Force

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add source

          if (git status --porcelain) {
            git commit -m "Publish structured AstroStack 1.2 source"
            git push
          }
