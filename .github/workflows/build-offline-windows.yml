name: Build and verify AstroStack 1.4 portable Windows

on:
  workflow_dispatch:
  push:
    branches:
      - astrostack-1.4-render-layout
    paths:
      - 'source/**'
      - '.github/workflows/build-offline-windows.yml'

permissions:
  contents: read

jobs:
  portable-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Build the checked-out sources without rewriting them
        run: |
          ./source/build_portable.ps1
          if ($LASTEXITCODE) { throw 'Portable build failed.' }
          $Changes = git status --porcelain --untracked-files=no
          if ($Changes) { throw "Build modified tracked sources: $Changes" }
      - name: Verify extracted ZIP, editing, export and native EXE launch
        run: |
          ./source/app/tests/verify_portable.ps1 -Archive ./source/dist/AstroStack_1.4.0-preview_Windows_x64.zip
      - name: Upload verified portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AstroStack-1.4.0-preview-Windows-x64-portable-verified
          path: |
            source/dist/AstroStack_1.4.0-preview_Windows_x64.zip
            source/dist/AstroStack_1.4.0-preview_Windows_x64.zip.sha256.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload Windows verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AstroStack-1.4-Windows-verification
          path: |
            windows-verification/
            ~/AppData/Local/AstroStack/logs/
          if-no-files-found: warn
          retention-days: 30
