name: Extract AstroStack UI Sources

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-offline-windows.yml'

permissions:
  contents: write

jobs:
  extract-ui:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Estrai builder
        shell: powershell
        run: |
          Expand-Archive `
            -Path ".\AstroStack_Offline_Builder_1.2.0_preview.zip" `
            -DestinationPath ".\builder" `
            -Force

      - name: Copia sorgenti UI nel repository
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path .\ui-source | Out-Null

          Copy-Item `
            .\builder\app\astrostack\gui\*.py `
            .\ui-source\ `
            -Force

          Copy-Item `
            .\builder\app\main.py `
            .\ui-source\app-main.py `
            -Force

      - name: Commit sorgenti UI
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ui-source

          $changes = git status --porcelain

          if ($changes) {
            git commit -m "Expose AstroStack UI sources for 1.3 development"
            git push
          } else {
            Write-Host "Nessuna modifica da pubblicare."
          }
