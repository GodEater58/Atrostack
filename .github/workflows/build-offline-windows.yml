name: Build AstroStack Offline Windows

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-offline-windows.yml'
      - 'AstroStack_Offline_Builder_1.2.0_preview.zip'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Estrai builder
        shell: powershell
        run: |
          Expand-Archive `
            -Path ".\AstroStack_Offline_Builder_1.2.0_preview.zip" `
            -DestinationPath ".\builder" `
            -Force

      - name: Esponi sorgenti UI
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path .\ui-source | Out-Null
          Copy-Item .\builder\app\astrostack\gui\*.py .\ui-source\ -Force
          Copy-Item .\builder\app\main.py .\ui-source\app-main.py -Force

      - name: Upload UI source
        uses: actions/upload-artifact@v4
        with:
          name: AstroStack-UI-source-1.2
          path: ui-source
          if-no-files-found: error

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Prepara moduli Go
        shell: powershell
        run: |
          Push-Location .\builder\launcher
          if (-not (Test-Path go.mod)) { go mod init astrostack-launcher }
          Pop-Location

          Push-Location .\builder\setup
          if (-not (Test-Path go.mod)) { go mod init astrostack-setup }
          Pop-Location

      - name: Build installer offline
        shell: powershell
        run: |
          Set-Location .\builder
          .\build_offline.ps1 -Version '1.2.0_preview'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AstroStack-1.2.0-preview-offline-windows
          path: |
            builder/AstroStack_Setup_Offline_1.2.0_preview.exe
            builder/AstroStack_Setup_Offline_1.2.0_preview.exe.sha256.txt
          if-no-files-found: error
          compression-level: 0
