name: Build AstroStack 1.3 UX Offline Windows

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-offline-windows.yml'
      - 'AstroStack_Offline_Builder_1.2.0_preview.zip'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 55

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Estrai AstroStack 1.2
        shell: powershell
        run: |
          Expand-Archive `
            -Path ".\AstroStack_Offline_Builder_1.2.0_preview.zip" `
            -DestinationPath ".\builder" `
            -Force

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Applica UX AstroStack 1.3
        shell: powershell
        run: |
          @'
          from pathlib import Path
          import re

          root = Path("builder/app")
          mw_path = root / "astrostack/gui/main_window.py"
          es_path = root / "astrostack/gui/editor_sidebar.py"
          ver_path = root / "astrostack/__init__.py"

          s = mw_path.read_text(encoding="utf-8")

          def patch(old, new, name):
              global s
              n = s.count(old)
              if n != 1:
                  raise RuntimeError(
                      f"Patch '{name}' non applicabile: trovate {n} occorrenze"
                  )
              s = s.replace(old, new, 1)
              print("OK:", name)

          # ---------------------------------------------------------
          # Stato UX 1.3 + recovery automatico
          # ---------------------------------------------------------
          patch(
          '''        TH.set_theme(str(qs.value("theme", "scuro")))
                  self._build_ui()
                  self._restore_geometry()
          ''',
          '''        TH.set_theme(str(qs.value("theme", "scuro")))
                  self.ui_mode = str(qs.value("ui_mode", "simple"))
                  if self.ui_mode not in ("simple", "advanced"):
                      self.ui_mode = "simple"

                  recovery_base = os.environ.get("LOCALAPPDATA") or os.path.expanduser("~")
                  self._recovery_path = os.path.join(
                      recovery_base, "AstroStack", "recovery.astrostack"
                  )

                  self._build_ui()
                  self._restore_geometry()

                  self._autosave_timer = QTimer(self)
                  self._autosave_timer.setInterval(90000)
                  self._autosave_timer.timeout.connect(self._autosave_recovery)
                  self._autosave_timer.start()
          ''',
          "stato UX e autosave"
          )

          patch(
          '''        QTimer.singleShot(400, self._maybe_show_guide)
          ''',
          '''        QTimer.singleShot(300, self._startup_flow)
                  QTimer.singleShot(15000, self._autosave_recovery)
          ''',
          "startup 1.3"
          )

          patch(
          '''    def _maybe_show_guide(self):
          ''',
          '''    def _startup_flow(self):
                  self._maybe_offer_recovery()
                  self._maybe_show_guide()

              def _maybe_offer_recovery(self):
                  path = getattr(self, "_recovery_path", "")
                  if not path or not os.path.isfile(path):
                      return

                  try:
                      age = time.time() - os.path.getmtime(path)
                      if age > 7 * 24 * 3600:
                          os.remove(path)
                          return
                  except OSError:
                      return

                  r = QMessageBox.question(
                      self,
                      "Ripristino sessione",
                      "AstroStack ha trovato una sessione non chiusa correttamente.\\n\\n"
                      "Vuoi ripristinarla?",
                      QMessageBox.StandardButton.Yes | QMessageBox.StandardButton.No,
                  )
                  if r == QMessageBox.StandardButton.Yes:
                      self.open_project(path=path, recovery=True)
                  else:
                      try:
                          os.remove(path)
                      except OSError:
                          pass

              def _autosave_recovery(self):
                  if self.worker is not None and self.worker.isRunning():
                      return

                  has_files = any(z.files for z in self.zones.values())
                  if self.current_image is None and not has_files:
                      return

                  try:
                      os.makedirs(
                          os.path.dirname(self._recovery_path),
                          exist_ok=True,
                      )
                      project_io.save_project(
                          self._recovery_path,
                          {k: list(z.files) for k, z in self.zones.items()},
                          self.settings_panel.to_settings().__dict__,
                          self.layers,
                          self.current_image,
                          not self.nonlinear,
                          self.opened_path,
                          self.annotations,
                          {
                              "workspace": self.workspace,
                              "ui_mode": self.ui_mode,
                              "recovery": True,
                              "snapshots":
                                  self.editor_sidebar.snapshots()
                                  if hasattr(self, "editor_sidebar")
                                  else [],
                          },
                      )
                  except Exception:
                      pass

              def _maybe_show_guide(self):
          ''',
          "recovery"
          )

          # ---------------------------------------------------------
          # Home
          # ---------------------------------------------------------
          patch(
          '''        root.addWidget(self.context_bar)

                  split = QSplitter(Qt.Orientation.Horizontal)
          ''',
          '''        root.addWidget(self.context_bar)

                  self.home_panel = QFrame()
                  self.home_panel.setProperty("role", "panel")

                  home = QVBoxLayout(self.home_panel)
                  home.setContentsMargins(42, 38, 42, 38)
                  home.setSpacing(14)

                  home.addStretch(1)

                  home_title = QLabel("Benvenuto in AstroStack")
                  home_title.setProperty("role", "title")
                  home.addWidget(home_title)

                  home_sub = QLabel(
                      "Scegli cosa vuoi fare. Puoi creare uno stack oppure "
                      "aprire direttamente una fotografia nell'Editor."
                  )
                  home_sub.setProperty("role", "muted")
                  home_sub.setWordWrap(True)
                  home.addWidget(home_sub)

                  home.addSpacing(10)

                  home_buttons = QHBoxLayout()
                  home_buttons.setSpacing(10)

                  self.btn_home_stack = AnimatedButton(
                      "✦  Nuovo stack", "primary"
                  )
                  self.btn_home_editor = AnimatedButton(
                      "Apri nell'Editor…"
                  )
                  self.btn_home_project = AnimatedButton(
                      "Apri progetto…"
                  )

                  self.btn_home_stack.clicked.connect(
                      lambda: self._set_workspace("stack")
                  )
                  self.btn_home_editor.clicked.connect(self._enter_editor)
                  self.btn_home_project.clicked.connect(self.open_project)

                  home_buttons.addWidget(self.btn_home_stack)
                  home_buttons.addWidget(self.btn_home_editor)
                  home_buttons.addWidget(self.btn_home_project)

                  home.addLayout(home_buttons)

                  recent = str(
                      QSettings("AstroStack", "AstroStack").value(
                          "recent_project", ""
                      ) or ""
                  )

                  self.btn_home_recent = AnimatedButton(
                      "Continua ultimo progetto"
                  )
                  self.btn_home_recent.setEnabled(
                      bool(recent and os.path.isfile(recent))
                  )
                  self.btn_home_recent.clicked.connect(
                      lambda: self.open_project(path=recent)
                      if recent else None
                  )
                  home.addWidget(self.btn_home_recent)

                  hint = QLabel(
                      "Suggerimento: puoi anche trascinare immagini o "
                      "cartelle direttamente dentro AstroStack."
                  )
                  hint.setProperty("role", "muted")
                  hint.setWordWrap(True)
                  home.addWidget(hint)

                  home.addStretch(2)

                  root.addWidget(self.home_panel, 1)

                  split = QSplitter(Qt.Orientation.Horizontal)
                  self.main_splitter = split
          ''',
          "Home"
          )

          # ---------------------------------------------------------
          # Pulsante Semplice / Avanzata
          # ---------------------------------------------------------
          patch(
          '''        head.addSpacing(10)
                  self.lang_switch = LangSwitch(QSettings("AstroStack", "AstroStack").value("language", "it"))
          ''',
          '''        head.addSpacing(10)

                  self.btn_ui_mode = AnimatedButton("Semplice")
                  self.btn_ui_mode.setToolTip(
                      "Alterna tra i controlli essenziali e tutti "
                      "gli strumenti avanzati."
                  )
                  self.btn_ui_mode.clicked.connect(self.toggle_ui_mode)
                  head.addWidget(self.btn_ui_mode)

                  self.lang_switch = LangSwitch(QSettings("AstroStack", "AstroStack").value("language", "it"))
          ''',
          "pulsante semplice avanzata"
          )

          patch(
          '''        self.setAcceptDrops(True)
                  self._set_workspace("stack")
          ''',
          '''        self.setAcceptDrops(True)
                  self._set_workspace("stack")
                  self._apply_ui_mode()
                  self._show_home()
          ''',
          "home startup"
          )

          patch(
          '''    def _enter_editor(self):
          ''',
          '''    def _show_home(self):
                  if not hasattr(self, "home_panel"):
                      return
                  self.home_panel.show()
                  if hasattr(self, "main_splitter"):
                      self.main_splitter.hide()
                  if hasattr(self, "context_bar"):
                      self.context_bar.hide()

              def _leave_home(self):
                  if hasattr(self, "home_panel"):
                      self.home_panel.hide()
                  if hasattr(self, "main_splitter"):
                      self.main_splitter.show()
                  if hasattr(self, "context_bar"):
                      self.context_bar.show()

              def toggle_ui_mode(self):
                  self.ui_mode = (
                      "advanced"
                      if self.ui_mode == "simple"
                      else "simple"
                  )
                  QSettings(
                      "AstroStack", "AstroStack"
                  ).setValue("ui_mode", self.ui_mode)

                  self._apply_ui_mode()

                  self.toast.show_message(
                      "Modalità avanzata"
                      if self.ui_mode == "advanced"
                      else "Modalità semplice"
                  )

              def _apply_ui_mode(self):
                  advanced = self.ui_mode == "advanced"

                  if hasattr(self, "btn_ui_mode"):
                      self.btn_ui_mode.setText(
                          "Avanzata" if advanced else "Semplice"
                      )

                  if hasattr(self, "settings_panel"):
                      self.settings_panel.adv_btn.setVisible(advanced)
                      if not advanced:
                          self.settings_panel.adv.hide()

                  if hasattr(self, "tools"):
                      self.tools.setVisible(advanced)

                  editor = self.workspace == "editor"

                  for name in (
                      "btn_sort",
                      "btn_live",
                      "btn_batch",
                      "btn_report",
                      "btn_frames",
                      "btn_log",
                  ):
                      w = getattr(self, name, None)
                      if w is not None:
                          w.setVisible(advanced and not editor)

                  if hasattr(self, "btn_restack"):
                      self.btn_restack.setVisible(
                          advanced and not editor
                      )

                  if hasattr(self, "btn_layers"):
                      self.btn_layers.setVisible(advanced)

              def _enter_editor(self):
          ''',
          "metodi home e modalità"
          )

          patch(
          '''        mode = "editor" if mode == "editor" else "stack"
                  self.workspace = mode
          ''',
          '''        if hasattr(self, "home_panel"):
                      self._leave_home()

                  mode = "editor" if mode == "editor" else "stack"
                  self.workspace = mode
          ''',
          "uscita Home"
          )

          patch(
          '''            elif self.current_image is None:
                      self.preview_label.setText("Nessuna anteprima: carica i light e premi Stack.")

              def _apply_editor_preset(self, key: str):
          ''',
          '''            elif self.current_image is None:
                      self.preview_label.setText("Nessuna anteprima: carica i light e premi Stack.")

                  self._apply_ui_mode()

              def _apply_editor_preset(self, key: str):
          ''',
          "applica modalità al workspace"
          )

          # ---------------------------------------------------------
          # Preset astrofotografici aggiuntivi
          # ---------------------------------------------------------
          patch(
          '''        if key == "natural":
                      p.vibrance, p.clarity = 8.0, 5.0
                  elif key == "contrast":
          ''',
          '''        if key == "natural":
                      p.vibrance, p.clarity = 8.0, 5.0

                  elif key == "galaxy":
                      p.contrast = 18.0
                      p.blacks = -12.0
                      p.vibrance = 18.0
                      p.saturation = 4.0
                      p.clarity = 18.0
                      p.dehaze = 12.0
                      p.nr_luminance = 10.0
                      p.star_reduce = 8.0

                  elif key == "cluster":
                      p.contrast = 10.0
                      p.highlights = -15.0
                      p.vibrance = 10.0
                      p.clarity = 12.0
                      p.sharpen = 35.0
                      p.nr_luminance = 8.0

                  elif key == "milkyway":
                      p.exposure = 0.15
                      p.contrast = 16.0
                      p.vibrance = 24.0
                      p.saturation = 8.0
                      p.clarity = 12.0
                      p.dehaze = 20.0
                      p.nr_luminance = 18.0

                  elif key == "moon":
                      p.saturation = -70.0
                      p.highlights = -25.0
                      p.contrast = 25.0
                      p.clarity = 30.0
                      p.sharpen = 45.0
                      p.dehaze = 10.0

                  elif key == "contrast":
          ''',
          "preset soggetti"
          )

          # ---------------------------------------------------------
          # Progetto recente + recovery
          # ---------------------------------------------------------
          patch(
          '''            self.project_path = path
                      self.status.setText(f"Progetto salvato: {path}")
          ''',
          '''            self.project_path = path
                      QSettings(
                          "AstroStack", "AstroStack"
                      ).setValue("recent_project", path)
                      self.status.setText(f"Progetto salvato: {path}")
          ''',
          "progetto recente salvataggio"
          )

          patch(
          '''    def open_project(self):
                  if self.worker is not None and self.worker.isRunning():
                      return
                  path, _ = QFileDialog.getOpenFileName(self, tr("Apri progetto"), "", tr("Progetto AstroStack (*.astrostack)"))
                  if not path:
                      return
          ''',
          '''    def open_project(
                  self,
                  checked: bool = False,
                  path: Optional[str] = None,
                  recovery: bool = False,
              ):
                  if self.worker is not None and self.worker.isRunning():
                      return

                  if not path:
                      path, _ = QFileDialog.getOpenFileName(
                          self,
                          tr("Apri progetto"),
                          "",
                          tr("Progetto AstroStack (*.astrostack)")
                      )
                      if not path:
                          return
          ''',
          "open_project recovery"
          )

          patch(
          '''        self.project_path = path
                  for k, z in self.zones.items():
          ''',
          '''        self.project_path = None if recovery else path
                  for k, z in self.zones.items():
          ''',
          "project path recovery"
          )

          patch(
          '''        self._set_workspace(preferred)

              # ------------------------------------------------------------ smistamento
          ''',
          '''        self._set_workspace(preferred)

                  if recovery:
                      self.status.setText("Sessione ripristinata automaticamente.")
                      self.status.setStyleSheet(f"color: {TH.OK};")
                      self.toast.show_message("Sessione precedente ripristinata")
                  else:
                      QSettings(
                          "AstroStack", "AstroStack"
                      ).setValue("recent_project", path)

              # ------------------------------------------------------------ smistamento
          ''',
          "fine apertura progetto"
          )

          # ---------------------------------------------------------
          # Riepilogo finale stack
          # ---------------------------------------------------------
          patch(
          '''        if getattr(self, "_batch_folder", ""):
                      self._batch_finish_one()

              def _on_failed(self, msg: str):
          ''',
          '''        if getattr(self, "_batch_folder", ""):
                      self._batch_finish_one()
                  else:
                      self._show_stack_summary(res)

              def _show_stack_summary(self, res: StackResult):
                  total = len(res.frames)
                  used = int(res.n_used)
                  rejected = max(0, total - used)

                  settings = self.settings_panel.to_settings()

                  methods = {
                      "auto": "Automatico",
                      "sigma": "Kappa-sigma",
                      "winsor": "Sigma winsorizzato",
                      "linearfit": "Linear-fit clipping",
                      "mediana": "Mediana",
                      "media": "Media",
                      "scie": "Scie stellari",
                  }

                  text = (
                      f"Frame analizzati: {total}\\n"
                      f"Frame utilizzati: {used}\\n"
                      f"Frame esclusi: {rejected}\\n"
                      f"Tempo: {res.elapsed:.0f} s\\n"
                      f"Metodo: {methods.get(settings.method, settings.method)}\\n"
                      f"Drizzle: {settings.drizzle}×\\n"
                      f"Gradiente: {res.gradient.describe()}"
                  )

                  box = QMessageBox(self)
                  box.setWindowTitle("Stack completato")
                  box.setIcon(QMessageBox.Icon.Information)
                  box.setText("Stack completato con successo")
                  box.setInformativeText(text)

                  btn_editor = box.addButton(
                      "Apri nell'Editor",
                      QMessageBox.ButtonRole.ActionRole,
                  )
                  btn_export = box.addButton(
                      "Esporta…",
                      QMessageBox.ButtonRole.ActionRole,
                  )
                  box.addButton(QMessageBox.StandardButton.Close)

                  box.exec()

                  clicked = box.clickedButton()

                  if clicked is btn_editor:
                      self._set_workspace("editor")
                  elif clicked is btn_export:
                      self.save_result()

              def _on_failed(self, msg: str):
          ''',
          "riepilogo stack"
          )

          # ---------------------------------------------------------
          # Cancella recovery alla chiusura corretta
          # ---------------------------------------------------------
          patch(
          '''        if self.result is not None:
                      self.result.cleanup()
                  e.accept()
          ''',
          '''        if self.result is not None:
                      self.result.cleanup()

                  try:
                      if os.path.isfile(self._recovery_path):
                          os.remove(self._recovery_path)
                  except OSError:
                      pass

                  e.accept()
          ''',
          "cleanup recovery"
          )

          mw_path.write_text(s, encoding="utf-8")

          # ---------------------------------------------------------
          # EditorSidebar - preset per soggetto
          # ---------------------------------------------------------
          es = es_path.read_text(encoding="utf-8")

          old_presets = '''    PRESETS = (
                  ("natural", "Naturale"),
                  ("contrast", "Più contrasto"),
                  ("nebula", "Nebulose vivaci"),
                  ("detail", "Dettaglio massimo"),
                  ("soft", "Versione morbida"),
                  ("mono", "Mono / Ha"),
              )
          '''

          new_presets = '''    PRESETS = (
                  ("natural", "Naturale"),
                  ("galaxy", "Galassia"),
                  ("nebula", "Nebulosa"),
                  ("cluster", "Ammasso stellare"),
                  ("milkyway", "Via Lattea"),
                  ("moon", "Luna"),
                  ("contrast", "Più contrasto"),
                  ("detail", "Dettaglio massimo"),
                  ("soft", "Versione morbida"),
                  ("mono", "Mono / Ha"),
              )
          '''

          if old_presets not in es:
              raise RuntimeError("PRESETS EditorSidebar non trovato")

          es = es.replace(old_presets, new_presets, 1)
          es_path.write_text(es, encoding="utf-8")
          print("OK: preset EditorSidebar")

          # ---------------------------------------------------------
          # Versione 1.3
          # ---------------------------------------------------------
          if ver_path.exists():
              version = ver_path.read_text(encoding="utf-8")
              version, n = re.subn(
                  r'__version__\\s*=\\s*["\\'][^"\\']+["\\']',
                  '__version__ = "1.3.0-preview"',
                  version,
                  count=1,
              )
              if n:
                  ver_path.write_text(version, encoding="utf-8")
                  print("OK: versione 1.3.0-preview")
              else:
                  print("ATTENZIONE: __version__ non trovato")

          print("Patch AstroStack 1.3 completata.")
          '@ | Set-Content -Path ".\patch_v13.py" -Encoding UTF8

          python ".\patch_v13.py"

      - name: Controllo sintassi Python
        shell: powershell
        run: |
          python -m py_compile `
            ".\builder\app\astrostack\gui\main_window.py" `
            ".\builder\app\astrostack\gui\editor_sidebar.py"

      - name: Pubblica sorgenti UI 1.3
        shell: powershell
        run: |
          Remove-Item ".\ui-source-v1.3" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path ".\ui-source-v1.3" | Out-Null

          Copy-Item `
            ".\builder\app\astrostack\gui\*.py" `
            ".\ui-source-v1.3\" `
            -Force

          Copy-Item `
            ".\builder\app\astrostack\__init__.py" `
            ".\ui-source-v1.3\package-init.py" `
            -Force

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ui-source-v1.3

          $changes = git status --porcelain

          if ($changes) {
            git commit -m "AstroStack 1.3 UX preview sources"
            git push
          }

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Prepara moduli Go
        shell: powershell
        run: |
          Push-Location ".\builder\launcher"
          if (-not (Test-Path "go.mod")) {
            go mod init astrostack-launcher
          }
          Pop-Location

          Push-Location ".\builder\setup"
          if (-not (Test-Path "go.mod")) {
            go mod init astrostack-setup
          }
          Pop-Location

      - name: Build AstroStack 1.3 Offline
        shell: powershell
        run: |
          Set-Location ".\builder"
          .\build_offline.ps1 -Version "1.3.0_preview"

      - name: Upload AstroStack 1.3
        uses: actions/upload-artifact@v4
        with:
          name: AstroStack-1.3.0-preview-offline-windows
          path: |
            builder/AstroStack_Setup_Offline_1.3.0_preview.exe
            builder/AstroStack_Setup_Offline_1.3.0_preview.exe.sha256.txt
          if-no-files-found: error
          compression-level: 0
