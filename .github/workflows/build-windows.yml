name: Build Windows offline installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Installer version label'
        required: false
        default: '1.4.0_preview'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $version = '${{ inputs.version }}'
          } else {
            $version = '${{ github.ref_name }}'.TrimStart('v')
          }
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Build offline installer
        shell: pwsh
        env:
          GO111MODULE: 'off'
        run: ./source/build_offline.ps1 -Version '${{ steps.version.outputs.value }}'

      - name: Verify installer files
        shell: pwsh
        run: |
          $exe = Get-ChildItem source/AstroStack_Setup_Offline_*.exe | Select-Object -First 1
          $sha = Get-ChildItem source/AstroStack_Setup_Offline_*.sha256.txt | Select-Object -First 1
          if (-not $exe -or -not $sha) { throw 'Installer or checksum missing.' }
          Write-Host "Installer: $($exe.FullName)"
          Write-Host "Checksum: $($sha.FullName)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AstroStack-Windows-${{ steps.version.outputs.value }}
          path: |
            source/AstroStack_Setup_Offline_*.exe
            source/AstroStack_Setup_Offline_*.sha256.txt
          if-no-files-found: error

      - name: Publish GitHub Release for tags
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' `
            source/AstroStack_Setup_Offline_*.exe `
            source/AstroStack_Setup_Offline_*.sha256.txt `
            --title 'AstroStack ${{ github.ref_name }}' `
            --generate-notes
