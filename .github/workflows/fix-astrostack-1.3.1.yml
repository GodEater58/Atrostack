name: Fix and verify AstroStack 1.3.1

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-astrostack-1.3.1.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Correggi installer e versione 1.3.1
        shell: python
        run: |
          from pathlib import Path
          setup = Path("source/setup/install_offline.ps1")
          text = setup.read_text(encoding="utf-8-sig")
          text = text.replace('[string[]]$Args', '[string[]]$ProcessArgs')
          text = text.replace('-ArgumentList $Args', '-ArgumentList $ProcessArgs')
          text = text.replace('1.3.0-preview-offline', '1.3.1-preview-offline')
          text = text.replace('AstroStack 1.3.0 Preview', 'AstroStack 1.3.1 Preview')
          assert '[string[]]$ProcessArgs' in text
          assert '-ArgumentList $ProcessArgs' in text
          assert '1.3.1-preview-offline' in text
          assert 'AstroStack 1.3.1 Preview' in text
          setup.write_text(text, encoding="utf-8")
          version = Path("source/app/astrostack/__init__.py")
          version.write_text(version.read_text(encoding="utf-8-sig").replace('1.3.0-preview', '1.3.1-preview'), encoding="utf-8")
          build = Path("source/build_offline.ps1")
          build.write_text(build.read_text(encoding="utf-8-sig").replace("1.2.0_preview", "1.3.1_preview"), encoding="utf-8")

      - name: Verifica sintassi PowerShell e Run-Process reale
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('source/setup/install_offline.ps1', 'source/build_offline.ps1')) {
            $tokens = $null
            $parseErrors = $null
            $ast = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
            if ($path -like '*/setup/*') { $installerAst = $ast }
          }
          # Load only the real function, without installer UI or side effects.
          $functions = @($installerAst.FindAll({ param($node)
            $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq 'Run-Process'
          }, $true))
          if ($functions.Count -ne 1) { throw 'Expected exactly one Run-Process function.' }
          . ([scriptblock]::Create($functions[0].Extent.Text))
          # A null ArgumentList fails here; the nonzero case also proves forwarding.
          Run-Process $env:ComSpec @('/d', '/c', 'exit', '0')
          $caught = $false
          try { Run-Process $env:ComSpec @('/d', '/c', 'exit', '7') }
          catch {
            if ($_.Exception.Message -notmatch 'codice 7\.') { throw }
            $caught = $true
          }
          if (-not $caught) { throw 'Run-Process did not propagate exit code 7.' }
          Write-Host 'ASTROSTACK_INSTALLER_RUN_PROCESS_OK'

      - name: Controllo sintassi Python
        shell: powershell
        run: |
          python -m py_compile `
            ".\source\app\main.py" `
            ".\source\app\astrostack\__init__.py" `
            ".\source\app\astrostack\gui\main_window.py" `
            ".\source\app\astrostack\gui\ux_v13.py"

      - name: Installa dipendenze test
        shell: powershell
        run: |
          python -m pip install `
            --disable-pip-version-check `
            -r ".\source\app\requirements.txt"

      - name: Smoke test reale GUI
        shell: powershell
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          @'
          import os
          import sys
          import tempfile

          sys.path.insert(
              0,
              os.path.abspath("source/app"),
          )

          from PySide6.QtWidgets import QApplication

          from astrostack.gui.main_window import MainWindow
          from astrostack.gui.ux_v13 import install
          from astrostack.core import project as project_io
          from astrostack.core.pipeline import Settings


          app = QApplication([])

          win = MainWindow()

          install(win)

          # Home
          assert hasattr(
              win,
              "home_panel",
          )

          # Modalità semplice/avanzata
          assert hasattr(
              win,
              "btn_ui_mode",
          )

          # Editor standalone
          assert hasattr(
              win,
              "editor_sidebar",
          )

          win._set_workspace(
              "editor"
          )

          assert (
              win.workspace
              == "editor"
          )

          win._set_workspace(
              "stack"
          )

          assert (
              win.workspace
              == "stack"
          )

          # Preset Galassia
          win._apply_editor_preset(
              "galaxy"
          )

          params = (
              win.develop_panel.params()
          )

          assert abs(
              params.contrast - 18.0
          ) < 0.01

          assert abs(
              params.star_reduce - 8.0
          ) < 0.01

          # Progetto .astrostack
          with tempfile.TemporaryDirectory() as td:

              project = os.path.join(
                  td,
                  "test.astrostack",
              )

              project_io.save_project(
                  project,
                  {
                      "light": [],
                      "dark": [],
                      "flat": [],
                      "bias": [],
                  },
                  Settings().__dict__,
                  [],
                  None,
                  True,
                  None,
                  [],
                  {
                      "workspace": "stack",
                      "ui_mode": "simple",
                  },
              )

              win.open_project(
                  path=project
              )

              assert (
                  win.project_path
                  == project
              )

          print(
              "ASTROSTACK_GUI_SMOKE_TEST_OK"
          )

          win.close()

          app.processEvents()

          '@ | python -

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Prepara Go
        shell: powershell
        run: |
          Push-Location ".\source\launcher"

          if (-not (Test-Path "go.mod")) {
            go mod init astrostack-launcher
          }

          Pop-Location

          Push-Location ".\source\setup"

          if (-not (Test-Path "go.mod")) {
            go mod init astrostack-setup
          }

          Pop-Location

      - name: Build installer offline verificato
        shell: powershell
        run: |
          Set-Location ".\source"

          .\build_offline.ps1 `
            -Version "1.3.1_preview"

      - name: Salva correzioni 1.3.1
        shell: powershell
        run: |
          git config `
            user.name `
            "github-actions[bot]"

          git config `
            user.email `
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add `
            source/build_offline.ps1 `
            source/app/astrostack/__init__.py `
            source/app/astrostack/gui/ux_v13.py `
            source/setup/install_offline.ps1

          $changes = git diff --cached --name-only

          if ($changes) {

            git commit `
              -m "Fix and verify AstroStack 1.3.1"

            git push
          }

      - name: Upload installer verificato
        uses: actions/upload-artifact@v4
        with:
          name: AstroStack-1.3.1-preview-verified-offline-windows
          path: |
            source/AstroStack_Setup_Offline_1.3.1_preview.exe
            source/AstroStack_Setup_Offline_1.3.1_preview.exe.sha256.txt
          if-no-files-found: error
          compression-level: 0
