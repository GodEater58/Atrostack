function forecast(item){if(isTool(item))return {...consumptionStats(item.id),sites:{},transfers:[],purchaseBySite:{ROVIGO:0,CRESPINO:0},recommended:0,hasAction:false,priority:'Nessuna',rank:0,target:0,coverage:null};const sites={};for(const s of SITES)sites[s.id]=siteForecast(item,s.id);const virtual={ROVIGO:sites.ROVIGO.qty,CRESPINO:sites.CRESPINO.qty},transfers=[];const receivers=SITES.map(s=>sites[s.id]).filter(x=>x.needsAction&&x.need>0).sort((a,b)=>(a.qty<=0?-1:0)-(b.qty<=0?-1:0)||b.need-a.need);for(const r of receivers){const donorId=SITES.find(s=>s.id!==r.site)?.id;if(!donorId)continue;const donor=sites[donorId],surplus=Math.max(0,virtual[donorId]-donor.target),need=Math.max(0,r.target-virtual[r.site]);const q=Math.min(surplus,need);if(q>0){transfers.push({from:donorId,to:r.site,qty:q});virtual[donorId]-=q;virtual[r.site]+=q}}
const purchaseBySite={ROVIGO:0,CRESPINO:0};for(const s of SITES){const sf=sites[s.id];if(sf.target>0&&virtual[s.id]<=sf.reorderPoint)purchaseBySite[s.id]=Math.max(0,sf.target-virtual[s.id])}const recommended=SITES.reduce((a,s)=>a+purchaseBySite[s.id],0),st=consumptionStats(item.id),coverage=st.daily>0?totalQty(item)/st.daily:null,target=SITES.reduce((a,s)=>a+sites[s.id].target,0);let priority='Nessuna',rank=0;if(recommended>0&&SITES.some(s=>virtual[s.id]<=0&&sites[s.id].target>0)){priority='Critica';rank=3}else if(recommended>0){priority='Alta';rank=2}else if(transfers.length){priority='Trasferisci';rank=1}return {...st,sites,virtual,transfers,purchaseBySite,recommended,hasAction:recommended>0||transfers.length>0,priority,rank,target,coverage}}
function status(item){const q=totalQty(item);if(isTool(item)){const l=loanedQty(item);if(q<=0&&l>0)return ['Tutto assegnato','warn'];if(q<=0)return ['Non disponibile','danger'];return ['Disponibile','ok']}if(q<=0)return ['Esaurito','danger'];const f=forecast(item);if(f.recommended>0)return ['Sotto scorta','warn'];if(f.transfers.length)return ['Da riequilibrare','warn'];return ['OK','ok']}

function renderScanHome(){const el=document.getElementById('scanhome');el.innerHTML=`<div class="scanHero"><div class="scanIntro"><h2>Scansiona e lavora</h2><p>Inquadra il QR o il barcode dell'articolo. Se è registrato scegli chi sei e cosa stai facendo; se non lo è puoi censirlo subito.</p></div><div class="homeScanner" id="homeScanner"><div id="scanPlaceholder" class="scanPlaceholder"><div><div class="bigScan">▣</div><b>Scanner pronto</b><div style="font-size:12px;margin-top:7px;opacity:.75">Consenti l'accesso alla fotocamera oppure usa i pulsanti sotto.</div></div></div><video id="homeScanVideo" autoplay playsinline muted style="display:none"></video><div id="homeScanFrame" class="scanFrame" style="display:none"></div><div class="scanStatus" id="homeScanStatus">Avvio fotocamera…</div></div><div class="scanActions"><button class="btn" onclick="startHomeScanner(false)">▣ Avvia scanner</button><button class="btn secondary" onclick="document.getElementById('captureScan').click()">⌁ Scatta / leggi</button></div><input id="captureScan" type="file" accept="image/*" capture="environment" style="display:none" onchange="scanCapturedFile(this.files[0]);this.value=''"><div class="scanManual"><input id="homeManualCode" class="input" placeholder="Codice articolo / QR / barcode" onkeydown="if(event.key==='Enter')handleHomeScan(this.value)"><button class="btn secondary" onclick="handleHomeScan(document.getElementById('homeManualCode').value)">Apri</button></div><button class="btn secondary" style="width:100%" onclick="openItemForm()">+ Registra nuovo articolo</button></div>`;setTimeout(()=>startHomeScanner(true),180)}
function scannerFormats(){return ['code_128','qr_code','ean_13','ean_8','code_39']}
async function startHomeScanner(silent=false){if(ui.page!=='scanhome'||ui.scanBusy)return;const status=document.getElementById('homeScanStatus'),video=document.getElementById('homeScanVideo'),placeholder=document.getElementById('scanPlaceholder'),frame=document.getElementById('homeScanFrame');if(!('BarcodeDetector' in window)){if(status)status.textContent='Scanner live non supportato: usa un lettore Bluetooth/USB o inserisci il codice.';return}if(!navigator.mediaDevices?.getUserMedia){if(status)status.textContent='Fotocamera live non disponibile qui. Prova “Scatta / leggi” oppure inserisci il codice.';return}stopScanner();try{ui.scanBusy=true;ui.scannerStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});if(ui.page!=='scanhome'){stopScanner();ui.scanBusy=false;return}if(video){video.srcObject=ui.scannerStream;video.style.display='block';await video.play().catch(()=>{})}if(placeholder)placeholder.style.display='none';if(frame)frame.style.display='block';if(status)status.textContent='Inquadra il codice dentro il riquadro';const det=new BarcodeDetector({formats:scannerFormats()});const loop=async()=>{if(ui.page!=='scanhome'||!ui.scannerStream||!document.getElementById('homeScanVideo')){ui.scanBusy=false;return}try{const codes=await det.detect(video);if(codes.length){ui.scanBusy=false;handleHomeScan(codes[0].rawValue);return}}catch{}requestAnimationFrame(loop)};ui.scanBusy=false;requestAnimationFrame(loop)}catch(e){ui.scanBusy=false;if(status)status.textContent=silent?'Tocca “Avvia scanner” per usare la fotocamera.':'Fotocamera non autorizzata. Consenti l’accesso o usa un lettore esterno.'}}
async function scanCapturedFile(file){if(!file)return;if(!('BarcodeDetector' in window)){toast('Il browser non supporta la lettura del codice da immagine');return}try{const bmp=await createImageBitmap(file),det=new BarcodeDetector({formats:scannerFormats()}),codes=await det.detect(bmp);bmp.close?.();if(!codes.length){toast('Nessun QR/barcode riconosciuto nella foto');return}handleHomeScan(codes[0].rawValue)}catch(e){toast('Impossibile leggere il codice dalla foto')}}
function findItemFromScan(raw){const value=String(raw||'').trim();if(!value)return null;const p=parseScanned(value);if(p.kind==='item'){const direct=state.items.find(x=>String(x.code).toLowerCase()===String(p.code).toLowerCase());if(direct)return direct}const low=value.toLowerCase();return state.items.find(x=>(x.scanAliases||[]).some(a=>String(a).trim().toLowerCase()===low))||null}
function handleHomeScan(raw){const value=String(raw||'').trim();if(!value){toast('Codice vuoto');return}stopScanner();const p=parseScanned(value);if(p.kind==='location'){const l=state.locations.find(x=>x.code.toLowerCase()===p.code.toLowerCase());if(l){openScannedLocation(l);return}}const i=findItemFromScan(value);if(i){openQuickArticle(i);return}openUnknownScan(value)}
function operatorOptions(){return [...new Set([state.settings.operator,...(state.settings.operatorHistory||[])].filter(Boolean))].slice(0,12)}
function rememberOperator(name){name=String(name||'').trim();if(!name)return;state.settings.operator=name;state.settings.operatorHistory=[name,...(state.settings.operatorHistory||[]).filter(x=>String(x).toLowerCase()!==name.toLowerCase())].slice(0,12)}
function openQuickArticle(i){const tool=isTool(i),actions=tool?[['ASSIGN','→ Assegna'],['RETURN','← Restituisci'],['TRANSFER','⇄ Trasferisci'],['IN','+ Carico'],['ADJ+','Rettifica +'],['ADJ-','Rettifica -']]:[['OUT','− Scarico'],['IN','+ Carico'],['TRANSFER','⇄ Trasferisci'],['ADJ+','Rettifica +'],['ADJ-','Rettifica -']];openModal(`<div class="sheetHead"><h3>Articolo riconosciuto</h3><button class="iconbtn" onclick="closeModal();render()">✕</button></div><div class="quickArticle">${i.photo?`<img class="photoThumb" src="${i.photo}" alt="">`:''}<div class="qaMain"><div class="qaCode">${esc(i.code)}</div><div class="qaDesc">${esc(i.description)}</div><div class="meta"><span class="pill">Rovigo ${fmt(siteQty(i,'ROVIGO'))}</span><span class="pill">Crespino ${fmt(siteQty(i,'CRESPINO'))}</span>${tool?`<span class="pill warn">${fmt(loanedQty(i))} in uso</span>`:''}</div></div></div><div class="field" style="margin-top:13px"><label>Chi sei? *</label><input id="quickOperator" class="input" required list="operatorList" value="${esc(state.settings.operator||'')}" placeholder="Nome operatore"><datalist id="operatorList">${operatorOptions().map(x=>`<option value="${esc(x)}"></option>`).join('')}</datalist><div class="operatorHint">Il nome viene registrato nello storico del movimento.</div></div><div class="sectionTitle"><h3>Cosa stai facendo?</h3><span>${tool?'Utensile':'Consumabile'}</span></div><div class="quickActionGrid">${actions.map(a=>`<button class="btn ${a[0]==='OUT'||a[0]==='ASSIGN'?'':'secondary'}" onclick="continueQuickAction('${i.id}','${a[0]}')">${a[1]}</button>`).join('')}</div><button class="btn secondary" style="width:100%;margin-top:10px" onclick="closeModal();setTimeout(()=>startHomeScanner(false),120)">Scansiona un altro articolo</button>`)}
function continueQuickAction(id,action){const op=String(document.getElementById('quickOperator')?.value||'').trim();if(!op){toast('Indica chi sta eseguendo l’operazione');document.getElementById('quickOperator')?.focus();return}rememberOperator(op);save();ui.selectedItem=id;ui.moveType=action;closeModal();nav('movement');setTimeout(()=>document.querySelector('#movement input[name=qty]')?.focus(),120)}

function flowChart(days){const bins=[];let max=1;for(let n=days-1;n>=0;n--){const dt=new Date();dt.setHours(0,0,0,0);dt.setDate(dt.getDate()-n);const end=new Date(dt);end.setDate(end.getDate()+1);let cin=0,out=0;for(const m of state.movements){const t=new Date(m.at);if(t>=dt&&t<end){if(['IN','ADJ+'].includes(m.type))cin+=num(m.qty);if(['OUT','ADJ-'].includes(m.type))out+=num(m.qty)}}max=Math.max(max,cin,out);bins.push({cin,out})}return `<div class="chart">${bins.map(b=>`<div class="barGroup"><div class="bar in" style="height:${Math.max(2,b.cin/max*100)}%" title="Carico ${fmt(b.cin)}"></div><div class="bar out" style="height:${Math.max(2,b.out/max*100)}%" title="Scarico ${fmt(b.out)}"></div></div>`).join('')}</div>`}

<div class="searchbar"><input class="input" placeholder="Cerca codice, descrizione, ubicazione…" value="${esc(ui.search)}" oninput="ui.search=this.value;renderInventory()"><button class="iconbtn" onclick="openScanner('search')">▣</button></div>

function itemCard(i){const [txt,cls]=status(i),tool=isTool(i),loans=loanedQty(i);return `<div class="itemCard"><div class="itemTop"><div style="display:flex;gap:10px;min-width:0">${i.photo?`<img class="photoThumb" src="${i.photo}" alt="">`:''}<div><div class="itemCode">${esc(i.code)}</div><div class="itemDesc">${esc(i.description)}</div></div></div><div class="qty">${fmt(totalQty(i))} <small style="font-size:10px;color:var(--muted)">${esc(i.unit||'pz')}</small>${tool&&loans>0?`<div style="font-size:10px;color:var(--accent2);text-align:right">+ ${fmt(loans)} in uso</div>`:''}</div></div><div class="siteGrid">${SITES.map(s=>{const l=itemLoc(i,s.id);return `<div class="siteBox"><small>${s.name}</small><b>${fmt(siteQty(i,s.id))} ${esc(i.unit||'pz')}</b><small>⌖ ${esc(l?.code||'N/D')}</small><div class="locationPath">${esc(locationShort(l))}</div></div>`}).join('')}</div><div class="meta"><span class="pill ${cls}">${txt}</span><span class="pill ${tool?'badgeTool':'badgeCons'}">${tool?'Utensile':'Consumabile'}</span>${i.category?`<span class="pill">${esc(i.category)}</span>`:''}${tool&&loans>0?`<span class="pill warn">${fmt(loans)} assegnati</span>`:''}</div><div class="itemActions"><button class="btn secondary small" onclick="quickMove('${i.id}')">${tool?'Gestisci':'Movimento'}</button><button class="btn secondary small" onclick="quickTransfer('${i.id}')">Trasferisci</button><button class="btn secondary small" onclick="openLabel('${i.id}')">Etichetta</button><button class="btn secondary small" onclick="openItemForm('${i.id}')">Modifica</button></div></div>`}
function locationOptions(site,selected){return state.locations.filter(l=>l.site===site).sort((a,b)=>locationPath(a).localeCompare(locationPath(b))).map(l=>`<option value="${l.id}" ${selected===l.id?'selected':''}>${esc(l.code)} · ${esc(locationShort(l))}</option>`).join('')}
function openItemForm(id,scanAlias=''){const isNew=!id;const i=id?itemById(id):{id:null,code:nextCode('Altro'),description:'',category:'Altro',itemType:'CONSUMABLE',photo:'',unit:'pz',stockBySite:{ROVIGO:0,CRESPINO:0},siteLocationIds:{ROVIGO:state.locations.find(l=>l.site==='ROVIGO')?.id||'',CRESPINO:state.locations.find(l=>l.site==='CRESPINO')?.id||''},minQty:0,maxQty:0,minBySite:{ROVIGO:0,CRESPINO:0},targetBySite:{ROVIGO:0,CRESPINO:0},leadTime:state.settings.defaultLead||7,safetyDays:state.settings.safetyDays||7,supplier:'',notes:''};openModal(`<div class="sheetHead"><h3>${id?'Modifica articolo':'Nuovo articolo'}</h3><button class="iconbtn" onclick="closeModal();if(ui.page==='scanhome')render()">✕</button></div>${scanAlias?`<div class="selectedBox"><b>QR/barcode acquisito</b><div class="unknownCode" style="margin-top:7px">${esc(scanAlias)}</div><div class="info">Verrà collegato automaticamente al nuovo articolo.</div></div>`:''}<form class="formgrid" onsubmit="saveItem(event,'${id||''}')"><input type="hidden" name="scanAlias" value="${esc(scanAlias)}">

function handlePhotoInput(input){const file=input.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){toast('Seleziona un file immagine');return}const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const max=640,scale=Math.min(1,max/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*scale)),h=Math.max(1,Math.round(im.height*scale)),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);const data=c.toDataURL('image/jpeg',.68);document.getElementById('photoData').value=data;const p=document.getElementById('photoPreview');p.src=data;p.style.display='block';toast('Foto pronta')};im.src=r.result};r.readAsDataURL(file)}
function removeItemPhoto(){document.getElementById('photoData').value='';const p=document.getElementById('photoPreview');p.src='';p.style.display='none'}
function saveItem(e,id){e.preventDefault();const afterSave=e.submitter?.value||'save',f=new FormData(e.target),category=String(f.get('category')).trim()||'Altro',description=String(f.get('description')).trim();if(!description){toast('Inserisci la descrizione dell’articolo');return}const duplicate=duplicateItemByName(description,id);if(duplicate){const qR=fmt(siteQty(duplicate,'ROVIGO')),qC=fmt(siteQty(duplicate,'CRESPINO'));toast(`Articolo già presente · ${duplicate.code}`);if(confirm(`Articolo già presente in archivio:

${duplicate.code} · ${duplicate.description}
Rovigo: ${qR} ${duplicate.unit||'pz'}
Crespino: ${qC} ${duplicate.unit||'pz'}

Vuoi aprire l’articolo esistente?`)){closeModal();setTimeout(()=>openItemForm(duplicate.id),50)}return}let savedId=id||'';let code=id?itemById(id).code:nextCode(category);if(state.items.some(x=>x.code.toLowerCase()===code.toLowerCase()&&x.id!==id)){code=nextCode(category);if(state.items.some(x=>x.code.toLowerCase()===code.toLowerCase()&&x.id!==id)){toast('Impossibile generare un codice univoco');return}}const scanAlias=String(f.get('scanAlias')||'').trim(),existingAliases=id?(itemById(id)?.scanAliases||[]):[];const data={code,description,category,itemType:String(f.get('itemType'))==='TOOL'?'TOOL':'CONSUMABLE',photo:String(f.get('photoData')||''),scanAliases:[...new Set([...existingAliases,...(scanAlias?[scanAlias]:[])])],unit:String(f.get('unit')),siteLocationIds:{ROVIGO:String(f.get('locRovigo')||''),CRESPINO:String(f.get('locCrespino')||'')},minBySite:{ROVIGO:num(f.get('minRovigo')),CRESPINO:num(f.get('minCrespino'))},targetBySite:{ROVIGO:Math.max(num(f.get('minRovigo')),num(f.get('targetRovigo'))),CRESPINO:Math.max(num(f.get('minCrespino')),num(f.get('targetCrespino')))},minQty:num(f.get('minRovigo'))+num(f.get('minCrespino')),maxQty:Math.max(num(f.get('minRovigo')),num(f.get('targetRovigo')))+Math.max(num(f.get('minCrespino')),num(f.get('targetCrespino'))),leadTime:int(f.get('leadTime'),7),safetyDays:int(f.get('safetyDays'),7),supplier:String(f.get('supplier')).trim(),notes:String(f.get('notes')).trim()};if(id){const item=itemById(id),oldLoc={...item.siteLocationIds};Object.assign(item,data);syncItem(item);for(const s of SITES){const from=oldLoc[s.id]||'',to=data.siteLocationIds[s.id]||'';if(from&&to&&from!==to){state.movements.push({id:uid(),itemId:id,type:'RELOCATE',site:s.id,qty:siteQty(item,s.id),fromLocationId:from,toLocationId:to,before:siteQty(item,s.id),after:siteQty(item,s.id),operator:state.settings.operator||'',reference:'SPOSTAMENTO UBICAZIONE',note:'Ubicazione articolo aggiornata',at:isoNow()})}}}else{const ni={id:uid(),stockBySite:{ROVIGO:num(f.get('qtyRovigo')),CRESPINO:num(f.get('qtyCrespino'))},createdAt:isoNow(),...data};savedId=ni.id;syncItem(ni);state.items.push(ni);for(const s of SITES){const q=siteQty(ni,s.id);if(q>0)state.movements.push({id:uid(),itemId:ni.id,type:'IN',site:s.id,locationId:ni.siteLocationIds[s.id],qty:q,before:0,after:q,overallBefore:0,overallAfter:totalQty(ni),operator:state.settings.operator||'',reference:'GIACENZA INIZIALE',note:'Creazione articolo',at:isoNow()})}}try{save()}catch(err){toast('Memoria locale piena: riduci/rimuovi alcune foto ed esporta un backup');return}closeModal();render();if(afterSave==='print'&&savedId){openLabel(savedId);toast(`Articolo salvato · ${code} · etichetta pronta`)}else{toast(`Articolo salvato · ${code}`)}}
function deleteItem(id){if(!confirm('Eliminare questo articolo, lo storico e le assegnazioni collegate?'))return;state.items=state.items.filter(x=>x.id!==id);state.movements=state.movements.filter(x=>x.itemId!==id);state.loans=state.loans.filter(x=>x.itemId!==id);save();closeModal();render();toast('Articolo eliminato')}

function renderMovement(){const i=itemById(ui.selectedItem);document.getElementById('movement').innerHTML=`<div class="hero"><div><h2>Movimenti</h2><p>Carico, scarico, utensili e trasferimenti</p></div></div><div class="card"><div class="searchbar"><input id="moveSearch" class="input" placeholder="Codice o descrizione articolo" oninput="movementSearch(this.value)"><button class="iconbtn" onclick="openScanner('movement')">▣</button></div><div id="moveResults"></div>${i?selectedMoveBox(i):'<div class="empty">Cerca o scansiona un articolo.</div>'}</div>`}
function movementSearch(q){const box=document.getElementById('moveResults');q=q.trim().toLowerCase();if(!q){box.innerHTML='';return}const arr=state.items.filter(i=>(i.code+' '+i.description).toLowerCase().includes(q)).slice(0,8);box.innerHTML=arr.map(i=>`<button class="kpiRow" style="width:100%;color:var(--text)" onclick="selectMoveItem('${i.id}')"><span><b>${esc(i.code)}</b><br><small>${esc(i.description)}</small></span><b>${fmt(totalQty(i))} ${esc(i.unit)}</b></button>`).join('')}
function selectMoveItem(id){ui.selectedItem=id;const i=itemById(id);if(isTool(i)&&!['IN','ASSIGN','RETURN','TRANSFER','ADJ+','ADJ-'].includes(ui.moveType))ui.moveType='ASSIGN';if(!isTool(i)&&['ASSIGN','RETURN'].includes(ui.moveType))ui.moveType='OUT';renderMovement()}
function selectedMoveBox(i){const tool=isTool(i);if(tool&&!['IN','ASSIGN','RETURN','TRANSFER','ADJ+','ADJ-'].includes(ui.moveType))ui.moveType='ASSIGN';if(!tool&&['ASSIGN','RETURN'].includes(ui.moveType))ui.moveType='OUT';const isT=ui.moveType==='TRANSFER',buttons=tool?[['ASSIGN','ASSEGNA'],['RETURN','RESTITUISCI'],['TRANSFER','TRASFERISCI'],['IN','CARICO'],['ADJ+','RETT. +'],['ADJ-','RETT. -']]:[['IN','CARICO'],['OUT','SCARICO'],['TRANSFER','TRASFERISCI'],['ADJ+','RETT. +'],['ADJ-','RETT. -']];return `<div class="selectedBox"><b>${esc(i.code)}</b> · ${esc(i.description)} <span class="pill ${tool?'badgeTool':'badgeCons'}">${tool?'Utensile':'Consumabile'}</span><div class="siteGrid">${SITES.map(s=>`<div class="siteBox"><small>${s.name}</small><b>${fmt(siteQty(i,s.id))} ${esc(i.unit)}</b><small>${esc(itemLoc(i,s.id)?.code||'N/D')}</small><div class="locationPath">${esc(locationShort(itemLoc(i,s.id)))}</div></div>`).join('')}</div>${tool?`<div class="meta"><span class="pill">Totale proprietà: ${fmt(ownedQty(i))}</span><span class="pill warn">In uso: ${fmt(loanedQty(i))}</span></div>${activeLoans(i.id).map(l=>`<div class="loanCard"><b>${fmt(l.remaining)} ${esc(i.unit)} → ${esc(l.assignee||l.destination||'assegnato')}</b><br><small>${esc(l.machine||'')}${l.odl?` · ODL ${esc(l.odl)}`:''} · ${dateIt(l.at)}</small></div>`).join('')}`:''}</div><form onsubmit="saveMovement(event,'${i.id}')"><div class="moveType">${buttons.map(x=>`<button type="button" class="${ui.moveType===x[0]?'active':''}" onclick="ui.moveType='${x[0]}';renderMovement()">${x[1]}</button>`).join('')}</div><div class="formgrid" style="margin-top:11px">${isT?transferFields(i):ui.moveType==='ASSIGN'?assignFields(i):ui.moveType==='RETURN'?returnFields(i):normalMoveFields(i)}<div class="row2"><div class="field"><label>Operatore</label><input class="input" name="operator" value="${esc(state.settings.operator||'')}"></div><div class="field"><label>Riferimento / DDT</label><input class="input" name="reference" placeholder="Riferimento libero"></div></div><div class="field"><label>Nota</label><textarea name="note" placeholder="Motivo del movimento"></textarea></div><button class="btn" type="submit">Registra operazione</button></div></form>`}
function normalMoveFields(i){const out=ui.moveType==='OUT';return `<div class="row2"><div class="field"><label>Sede *</label><select name="site">${SITES.map(s=>`<option value="${s.id}">${s.name} · ${fmt(siteQty(i,s.id))} ${esc(i.unit)}</option>`).join('')}</select></div><div class="field"><label>Quantità *</label><input class="input" name="qty" type="number" step="0.01" min="0.01" required autofocus></div></div>${out?`<div class="row2"><div class="field"><label>Macchina / impianto</label><input class="input" name="machine" placeholder="Linea, macchina, impianto…"></div><div class="field"><label>ODL</label><input class="input" name="odl" placeholder="Ordine di lavoro"></div></div>`:''}`}
function transferFields(i){if(ui.fromSite===ui.toSite)ui.toSite=ui.fromSite==='ROVIGO'?'CRESPINO':'ROVIGO';const pre=Math.min(siteQty(i,ui.fromSite),Math.max(0,num(ui.transferPrefill)));return `<div class="row2"><div class="field"><label>Da *</label><select name="fromSite" onchange="ui.fromSite=this.value;if(ui.toSite===this.value)ui.toSite=this.value==='ROVIGO'?'CRESPINO':'ROVIGO';renderMovement()">${SITES.map(s=>`<option value="${s.id}" ${ui.fromSite===s.id?'selected':''}>${s.name} · ${fmt(siteQty(i,s.id))} ${esc(i.unit)}</option>`).join('')}</select></div><div class="field"><label>A *</label><select name="toSite" onchange="ui.toSite=this.value;renderMovement()">${SITES.map(s=>`<option value="${s.id}" ${ui.toSite===s.id?'selected':''}>${s.name}</option>`).join('')}</select></div></div><div class="transferArrow">↓</div><div class="field"><label>Quantità da trasferire *</label><input class="input" name="qty" type="number" step="0.01" min="0.01" max="${siteQty(i,ui.fromSite)}" value="${pre>0?pre:''}" required autofocus></div><p class="info">Il trasferimento sposta la giacenza senza essere conteggiato come consumo o acquisto.</p>`}
function assignFields(i){return `<div class="row2"><div class="field"><label>Preleva da *</label><select name="site">${SITES.map(s=>`<option value="${s.id}">${s.name} · ${fmt(siteQty(i,s.id))} disponibili</option>`).join('')}</select></div><div class="field"><label>Quantità *</label><input class="input" name="qty" type="number" step="0.01" min="0.01" required></div></div><div class="row2"><div class="field"><label>Assegnato a *</label><input class="input" name="assignee" required placeholder="Persona / reparto"></div><div class="field"><label>Destinazione</label><input class="input" name="destination" placeholder="Reparto / area"></div></div><div class="row2"><div class="field"><label>Macchina / impianto</label><input class="input" name="machine" placeholder="Macchina o linea"></div><div class="field"><label>ODL</label><input class="input" name="odl" placeholder="Ordine di lavoro"></div></div>`}
function returnFields(i){const loans=activeLoans(i.id);if(!loans.length)return `<div class="empty">Non risultano utensili assegnati da restituire.</div><input type="hidden" name="qty" value="0">`;const pref=loans.some(l=>l.id===ui.returnLoanPrefill)?ui.returnLoanPrefill:'';const selected=pref?loans.find(l=>l.id===pref):loans[0];return `<div class="field"><label>Assegnazione da chiudere *</label><select name="loanId" onchange="ui.returnLoanPrefill=this.value;renderMovement()">${loans.map(l=>`<option value="${l.id}" ${l.id===pref?'selected':''}>${fmt(l.remaining)} ${esc(i.unit)} · ${esc(l.assignee||l.destination||'assegnato')} · ${esc(siteName(l.site))}</option>`).join('')}</select></div>${selected?`<div class="selectedBox"><b>${esc(selected.assignee||'Assegnatario non indicato')}</b><div class="info">${esc(selected.destination||'Destinazione non indicata')}${selected.machine?` · ${esc(selected.machine)}`:''}${selected.odl?` · ODL ${esc(selected.odl)}`:''}</div></div>`:''}<div class="row2"><div class="field"><label>Rientra a *</label><select name="site">${SITES.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select></div><div class="field"><label>Quantità restituita *</label><input class="input" name="qty" type="number" step="0.01" min="0.01" max="${selected?num(selected.remaining):''}" value="${selected?fmt(selected.remaining):''}" required></div></div>`}

function quickTransfer(id){ui.selectedItem=id;ui.moveType='TRANSFER';ui.transferPrefill=0;const i=itemById(id);ui.fromSite=siteQty(i,'ROVIGO')>0?'ROVIGO':'CRESPINO';ui.toSite=ui.fromSite==='ROVIGO'?'CRESPINO':'ROVIGO';closeModal();nav('movement')}
function startSuggestedTransfer(id,from,to,qty){ui.selectedItem=id;ui.moveType='TRANSFER';ui.fromSite=from;ui.toSite=to;ui.transferPrefill=qty;closeModal();nav('movement')}
function saveMovement(e,id){e.preventDefault();const i=itemById(id),f=new FormData(e.target),q=num(f.get('qty'));if(q<=0){toast('Inserisci una quantità valida');return}const operator=String(f.get('operator')).trim(),reference=String(f.get('reference')).trim(),note=String(f.get('note')).trim();if(ui.moveType==='TRANSFER'){const from=String(f.get('fromSite')),to=String(f.get('toSite'));if(from===to){toast('La sede di partenza e arrivo devono essere diverse');return}const bf=siteQty(i,from),bt=siteQty(i,to);if(q>bf){toast(`Trasferimento impossibile: a ${siteName(from)} ci sono ${fmt(bf)} ${i.unit}`);return}i.stockBySite[from]=bf-q;i.stockBySite[to]=bt+q;syncItem(i);state.movements.push({id:uid(),itemId:id,type:'TRANSFER',qty:q,fromSite:from,toSite:to,fromLocationId:i.siteLocationIds?.[from]||'',toLocationId:i.siteLocationIds?.[to]||'',beforeFrom:bf,afterFrom:bf-q,beforeTo:bt,afterTo:bt+q,overallBefore:totalQty(i),overallAfter:totalQty(i),operator,reference,note,at:isoNow()});ui.transferPrefill=0;save();renderMovement();toast(`${fmt(q)} ${i.unit} trasferiti: ${siteName(from)} → ${siteName(to)}`)}else if(ui.moveType==='ASSIGN'){if(!isTool(i)){toast('Operazione disponibile solo per utensili');return}const site=String(f.get('site')),before=siteQty(i,site);if(q>before){toast(`Disponibilità insufficiente a ${siteName(site)}`);return}const assignee=String(f.get('assignee')).trim(),destination=String(f.get('destination')).trim(),machine=String(f.get('machine')).trim(),odl=String(f.get('odl')).trim();if(!assignee){toast('Indica a chi viene assegnato');return}i.stockBySite[site]=before-q;syncItem(i);const loan={id:uid(),itemId:id,qty:q,remaining:q,site,assignee,destination,machine,odl,at:isoNow(),active:true};state.loans.push(loan);state.movements.push({id:uid(),itemId:id,type:'ASSIGN',site,locationId:i.siteLocationIds?.[site]||'',qty:q,before,after:before-q,operator,reference,note,assignee,destination,machine,odl,loanId:loan.id,at:isoNow()});save();renderMovement();toast('Utensile assegnato')}else if(ui.moveType==='RETURN'){if(!isTool(i)){toast('Operazione disponibile solo per utensili');return}const loan=state.loans.find(l=>l.id===String(f.get('loanId'))&&l.active!==false);if(!loan){toast('Assegnazione non trovata');return}if(q>num(loan.remaining)){toast(`Puoi restituire al massimo ${fmt(loan.remaining)} ${i.unit}`);return}const site=String(f.get('site')),before=siteQty(i,site);i.stockBySite[site]=before+q;loan.remaining=num(loan.remaining)-q;if(loan.remaining<=0){loan.remaining=0;loan.active=false;loan.returnedAt=isoNow()}syncItem(i);state.movements.push({id:uid(),itemId:id,type:'RETURN',site,locationId:i.siteLocationIds?.[site]||'',qty:q,before,after:before+q,operator,reference,note,assignee:loan.assignee,destination:loan.destination,machine:loan.machine,odl:loan.odl,loanId:loan.id,at:isoNow()});ui.returnLoanPrefill='';save();renderMovement();toast('Restituzione registrata')}else{const site=String(f.get('site')),before=siteQty(i,site),overallBefore=totalQty(i),subtract=['OUT','ADJ-'].includes(ui.moveType);if(subtract&&q>before){toast(`Scarico impossibile: a ${siteName(site)} ci sono ${fmt(before)} ${i.unit}`);return}const after=subtract?before-q:before+q;i.stockBySite[site]=after;syncItem(i);const machine=String(f.get('machine')||'').trim(),odl=String(f.get('odl')||'').trim();state.movements.push({id:uid(),itemId:id,type:ui.moveType,site,locationId:i.siteLocationIds?.[site]||'',qty:q,before,after,overallBefore,overallAfter:totalQty(i),operator,reference,note,machine,odl,at:isoNow()});save();renderMovement();toast('Movimento registrato')}if(operator)rememberOperator(operator);save()}

function renderReorder(){const arr=state.items.filter(i=>!isTool(i)).map(i=>({i,f:forecast(i)})).filter(x=>x.f.hasAction).sort((a,b)=>b.f.rank-a.f.rank||b.f.recommended-a.f.recommended);const transferCount=arr.reduce((a,x)=>a+x.f.transfers.length,0),buyCount=arr.filter(x=>x.f.recommended>0).length;document.getElementById('reorder').innerHTML=`<div class="hero"><div><h2>Scorte consigliate</h2><p>Prima riequilibra Rovigo e Crespino; acquista solo ciò che manca davvero</p></div></div><div class="grid stats" style="margin-bottom:12px"><div class="card stat"><div class="label">Trasferimenti suggeriti</div><div class="value">${transferCount}</div><div class="hint">tra le due sedi</div></div><div class="card stat"><div class="label">Articoli da acquistare</div><div class="value ${buyCount?'warnText':''}">${buyCount}</div><div class="hint">dopo il riequilibrio</div></div></div>${arr.length?arr.map(x=>reorderCard(x.i,x.f,false)).join(''):'<div class="empty">Le scorte delle due sedi risultano equilibrate.</div>'}<div class="card" style="margin-top:12px"><b>Come viene calcolato</b><p class="info">Ogni sede ha una propria scorta minima e un proprio target. Il consumo viene calcolato separatamente per Rovigo e Crespino. Se una sede è sotto soglia e l'altra ha materiale sopra il proprio target, Officina Stock suggerisce prima il trasferimento. Solo l'eventuale quantità ancora mancante viene proposta come acquisto. I trasferimenti non vengono conteggiati come consumo.</p></div>`}
function reorderCard(i,f,compact){const p=f.priority==='Critica'?'danger':f.priority==='Alta'?'warn':'ok',transferHtml=f.transfers.map(t=>`<div class="selectedBox" style="margin-top:9px"><b>⇄ Trasferisci ${fmt(Math.ceil(t.qty))} ${esc(i.unit)} · ${siteName(t.from)} → ${siteName(t.to)}</b>${compact?'':`<div class="info" style="margin-top:4px">Usa la giacenza già disponibile prima di effettuare un acquisto.</div><button class="btn secondary small" style="margin-top:8px;width:100%" onclick="startSuggestedTransfer('${i.id}','${t.from}','${t.to}',${t.qty})">Apri trasferimento</button>`}</div>`).join(''),buyHtml=f.recommended>0?`<div class="selectedBox" style="margin-top:9px"><b>+ Acquista ${fmt(Math.ceil(f.recommended))} ${esc(i.unit)}</b>${compact?'':`<div class="info" style="margin-top:4px">${SITES.filter(s=>f.purchaseBySite[s.id]>0).map(s=>`${s.name}: ${fmt(Math.ceil(f.purchaseBySite[s.id]))} ${esc(i.unit)}`).join(' · ')}</div>`}</div>`:'';return `<div class="reorderCard"><div class="reorderHead"><div><b>${esc(i.code)}</b><div class="itemDesc">${esc(i.description)}</div><div class="meta"><span class="pill ${p}">${f.priority}</span>${i.supplier?`<span class="pill">${esc(i.supplier)}</span>`:''}</div></div><div class="reorderQty">${f.recommended>0?'+'+fmt(Math.ceil(f.recommended)):'⇄'}<small style="font-size:10px;color:var(--muted)">${f.recommended>0?' '+esc(i.unit):' trasferisci'}</small></div></div>${transferHtml}${buyHtml}${compact?'':`<div class="siteGrid">${SITES.map(s=>{const sf=f.sites[s.id];return `<div class="siteBox"><small>${s.name}</small><b>${fmt(sf.qty)} ${esc(i.unit)}</b><small>Min ${fmt(sf.min)} · Target ${fmt(sf.target)}</small><div class="locationPath">Consumo 30 gg: ${fmt(sf.out30)} · Copertura: ${sf.coverage===null?'n.d.':fmt(sf.coverage)+' gg'}</div></div>`}).join('')}</div>`}</div>`}

function renderCount(){const locs=state.locations.filter(l=>l.site===ui.countSite).sort((a,b)=>locationPath(a).localeCompare(locationPath(b)));if(!locs.some(l=>l.id===ui.countLocationId))ui.countLocationId=locs[0]?.id||'';const loc=locById(ui.countLocationId),items=loc?state.items.filter(i=>i.siteLocationIds?.[ui.countSite]===loc.id).sort((a,b)=>(a.description||'').localeCompare(b.description||'')):[];const entered=items.filter(i=>Object.prototype.hasOwnProperty.call(ui.countValues,i.id)&&String(ui.countValues[i.id])!=='').length;document.getElementById('count').innerHTML=`<div class="hero"><div><h2>Inventario guidato</h2><p>Conta una posizione e registra solo le differenze</p></div><button class="btn secondary small" onclick="openScanner('countLocation')">▣ QR posizione</button></div><div class="card formgrid"><div class="row2"><div class="field"><label>Sede</label><select onchange="ui.countSite=this.value;ui.countLocationId='';ui.countValues={};renderCount()">${SITES.map(s=>`<option value="${s.id}" ${ui.countSite===s.id?'selected':''}>${s.name}</option>`).join('')}</select></div><div class="field"><label>Ubicazione</label><select onchange="ui.countLocationId=this.value;ui.countValues={};renderCount()">${locs.map(l=>`<option value="${l.id}" ${ui.countLocationId===l.id?'selected':''}>${esc(l.code)} · ${esc(locationShort(l))}</option>`).join('')}</select></div></div>${loc?`<div class="selectedBox"><b>${esc(loc.code)}</b><div class="locationPath">${esc(locationPath(loc))}</div></div>`:''}<div class="row2"><button class="btn secondary" onclick="openScanner('countItem')">▣ Scansiona articolo</button><button class="btn secondary" onclick="fillTheoreticalCounts()">= Copia teorico</button></div></div><div class="sectionTitle"><h3>Articoli nella posizione</h3><span>${entered}/${items.length} contati</span></div>${items.length?`<div class="countList">${items.map(i=>`<div id="count_${i.id}" class="countRow ${ui.countHighlight===i.id?'highlight':''}"><div><b>${esc(i.code)}</b><div class="itemDesc">${esc(i.description)}</div><div class="theory">Teorico: <b>${fmt(siteQty(i,ui.countSite))} ${esc(i.unit)}</b>${isTool(i)&&loanedQty(i)>0?` · ${fmt(loanedQty(i))} in uso (non inclusi)` :''}</div></div><input class="input" type="number" min="0" step="0.01" placeholder="Reale" value="${Object.prototype.hasOwnProperty.call(ui.countValues,i.id)?esc(ui.countValues[i.id]):''}" oninput="ui.countValues['${i.id}']=this.value"></div>`).join('')}</div><button class="btn" style="width:100%;margin-top:12px" onclick="applyInventory()">Applica rettifiche (${entered})</button>`:'<div class="empty">Nessun articolo assegnato a questa ubicazione.</div>'}`}
function fillTheoreticalCounts(){const loc=locById(ui.countLocationId);if(!loc)return;state.items.filter(i=>i.siteLocationIds?.[ui.countSite]===loc.id).forEach(i=>ui.countValues[i.id]=String(siteQty(i,ui.countSite)));renderCount();toast('Valori teorici copiati')}
function applyInventory(){const loc=locById(ui.countLocationId);if(!loc){toast('Seleziona una ubicazione');return}let n=0,checked=0;for(const i of state.items.filter(i=>i.siteLocationIds?.[ui.countSite]===loc.id)){if(!Object.prototype.hasOwnProperty.call(ui.countValues,i.id)||String(ui.countValues[i.id]).trim()==='')continue;checked++;const actual=num(ui.countValues[i.id],-1);if(actual<0){toast('Una quantità inventariata non è valida');return}const before=siteQty(i,ui.countSite),diff=actual-before;if(Math.abs(diff)<1e-9)continue;i.stockBySite[ui.countSite]=actual;syncItem(i);state.movements.push({id:uid(),itemId:i.id,type:diff>0?'ADJ+':'ADJ-',site:ui.countSite,locationId:loc.id,qty:Math.abs(diff),before,after:actual,overallBefore:totalQty(i)-diff,overallAfter:totalQty(i),operator:state.settings.operator||'',reference:'INVENTARIO',note:`Conteggio fisico · ${locationPath(loc)}`,at:isoNow()});n++}if(!checked){toast('Inserisci almeno una quantità reale');return}save();ui.countValues={};ui.countHighlight='';renderCount();toast(n?`${n} rettifiche registrate`:'Inventario verificato: nessuna differenza')}

function movementTypeLabel(m){return {IN:'Carico',OUT:'Scarico','ADJ+':'Rettifica +','ADJ-':'Rettifica -',TRANSFER:'Trasferimento',ASSIGN:'Assegnazione',RETURN:'Restituzione',RELOCATE:'Cambio ubicazione'}[m.type]||m.type}
function historyRoute(m){if(m.type==='TRANSFER')return `${siteName(m.fromSite)} → ${siteName(m.toSite)}`;if(m.type==='ASSIGN')return `${siteName(m.site)} → ${m.assignee||m.destination||'assegnato'}`;if(m.type==='RETURN')return `${m.assignee||'assegnato'} → ${siteName(m.site)}`;if(m.type==='RELOCATE')return `${siteName(m.site)} · ${locationShort(locById(m.fromLocationId))} → ${locationShort(locById(m.toLocationId))}`;return siteName(m.site)}

function renderHistory(){const ms=[...state.movements].sort((a,b)=>new Date(b.at)-new Date(a.at));document.getElementById('history').innerHTML=`<div class="hero"><div><h2>Storico</h2><p>Movimenti, inventari, utensili e ubicazioni</p></div><button class="btn secondary small" onclick="exportCSV()">CSV</button></div>${ms.length?`<div class="tablewrap"><table><thead><tr><th>Data</th><th>Codice</th><th>Tipo</th><th>Sede / percorso</th><th>Q.tà</th><th>Prima → Dopo</th><th>Macchina</th><th>ODL</th><th>Operatore</th><th>Rif.</th></tr></thead><tbody>${ms.map(m=>{const i=itemById(m.itemId),plus=['IN','ADJ+','RETURN'].includes(m.type),neutral=['TRANSFER','RELOCATE','ASSIGN'].includes(m.type),cls=neutral?'accent':plus?'positive':'negative',prefix=m.type==='TRANSFER'?'↔ ':m.type==='RELOCATE'?'⌖ ':m.type==='ASSIGN'?'→ ':m.type==='RETURN'?'← ':plus?'+':'-';return `<tr><td>${dateIt(m.at)}</td><td>${esc(i?.code||'-')}</td><td>${movementTypeLabel(m)}</td><td>${esc(historyRoute(m))}</td><td class="${cls}">${prefix}${m.type==='RELOCATE'?'':fmt(m.qty)}</td><td>${esc(historyBeforeAfter(m))}</td><td>${esc(m.machine||'')}</td><td>${esc(m.odl||'')}</td><td>${esc(m.operator||'')}</td><td>${esc(m.reference||'')}</td></tr>`}).join('')}</tbody></table></div>`:'<div class="empty">Nessun movimento registrato.</div>'}`}

function qrPayload(i){if(location.protocol==='http:'||location.protocol==='https:'){const u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('item',i.code);return u.toString()}return 'OSTOCK:'+i.code}

function openLabel(id){const i=itemById(id);openModal(`<div class="sheetHead"><h3>Etichetta articolo</h3><button class="iconbtn" onclick="closeModal()">✕</button></div><div class="labelPreview"><div><h3>${esc(i.code)}</h3><div class="desc">${esc(i.description)}</div><div class="category">${esc(i.category||'Altro')}</div><svg id="barcodeSvg" class="barcode" viewBox="0 0 300 70" preserveAspectRatio="none"></svg><div class="barcodeText">${esc(i.code)}</div></div><div class="qrWrap"><canvas id="qrCanvas" class="qrCode" width="264" height="264" aria-label="QR articolo"></canvas><div>QR OPERATIVO</div></div></div><p class="info"><b>Etichetta permanente:</b> contiene solo dati stabili dell'articolo. Giacenze e ubicazioni aggiornate vengono mostrate nell'app dopo la scansione.</p><div class="actions"><button class="btn secondary" onclick="closeModal()">Chiudi</button><button class="btn" onclick="window.print()">Stampa</button></div>`);setTimeout(()=>{drawCode128(document.getElementById('barcodeSvg'),i.code);drawQR(document.getElementById('qrCanvas'),qrPayload(i))},0)}
function openLocationLabel(id){const l=locById(id);if(!l)return;openModal(`<div class="sheetHead"><h3>Etichetta ubicazione</h3><button class="iconbtn" onclick="closeModal()">✕</button></div><div class="locationLabel"><div><h3>${esc(l.code)}</h3><div class="path"><b>${esc(siteName(l.site))}</b><br>${esc(locationShort(l))}${l.name?`<br>${esc(l.name)}`:''}</div><svg id="locBarcodeSvg" class="barcode" viewBox="0 0 300 70" preserveAspectRatio="none"></svg><div class="barcodeText">${esc(l.code)}</div></div><div class="qrWrap"><canvas id="locQrCanvas" class="qrCode" width="264" height="264" aria-label="QR ubicazione"></canvas><div>QR POSIZIONE</div></div></div><p class="info">Scansiona questo QR nella modalità Inventario per selezionare subito la posizione.</p><div class="actions"><button class="btn secondary" onclick="closeModal()">Chiudi</button><button class="btn" onclick="window.print()">Stampa</button></div>`);setTimeout(()=>{drawCode128(document.getElementById('locBarcodeSvg'),l.code);drawQR(document.getElementById('locQrCanvas'),locationQrPayload(l))},0)}
function drawQR(canvas,text){
 if(!canvas)return;
 const ctx=canvas.getContext&&canvas.getContext('2d');
 if(!ctx)return;
 const W=canvas.width||246,H=canvas.height||246;
 ctx.imageSmoothingEnabled=false;
 ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
 try{
  if(!window.OfficinaQRCode)throw new Error('Motore QR non disponibile');
  const qr=new window.OfficinaQRCode(-1,1);qr.addData(String(text));qr.make();
  const n=qr.getModuleCount(),quiet=4,total=n+quiet*2;
  const scale=Math.max(1,Math.floor(Math.min(W,H)/total));
  const size=scale*total,ox=Math.floor((W-size)/2),oy=Math.floor((H-size)/2);
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#000';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(qr.isDark(r,c))ctx.fillRect(ox+(c+quiet)*scale,oy+(r+quiet)*scale,scale,scale);
  canvas.dataset.qr='ok';
 }catch(e){
  canvas.dataset.qr='error';
  ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#b42318';ctx.font='bold 18px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('ERRORE QR',W/2,H/2);
  console.error('Errore generazione QR',e);
 }
}
function drawCode128(svg,text){if(!svg)return;const patterns=['212222','222122','222221','121223','121322','131222','122213','122312','132212','221213','221312','231212','112232','122132','122231','113222','123122','123221','223211','221132','221231','213212','223112','312131','311222','321122','321221','312212','322112','322211','212123','212321','232121','111323','131123','131321','112313','132113','132311','211313','231113','231311','112133','112331','132131','113123','113321','133121','313121','211331','231131','213113','213311','213131','311123','311321','331121','312113','312311','332111','314111','221411','431111','111224','111422','121124','121421','141122','141221','112214','112412','122114','122411','142112','142211','241211','221114','413111','241112','134111','111242','121142','121241','114212','124112','124211','411212','421112','421211','212141','214121','412121','111143','111341','131141','114113','114311','411113','411311','113141','114131','311141','411131','211412','211214','211232','2331112'];let vals=[];for(const ch of text){let v=ch.charCodeAt(0)-32;if(v<0||v>94)v=31;vals.push(v)}let checksum=104;vals.forEach((v,i)=>checksum+=v*(i+1));checksum%=103;const seq=[104,...vals,checksum,106];let x=8,units=seq.reduce((a,v)=>a+[...patterns[v]].reduce((s,n)=>s+Number(n),0),0)+16;svg.setAttribute('viewBox',`0 0 ${units} 70`);let out='';for(const v of seq){const p=patterns[v];let black=true;for(const c of p){const w=Number(c);if(black)out+=`<rect x="${x}" y="2" width="${w}" height="62" fill="#000"/>`;x+=w;black=!black}}svg.innerHTML=out}

function openSettings(){openModal(`<div class="sheetHead"><h3>Impostazioni</h3><button class="iconbtn" onclick="closeModal()">✕</button></div><form class="formgrid" onsubmit="saveSettings(event)"><div class="field"><label>Nome officina / reparto</label><input class="input" name="shopName" value="${esc(state.settings.shopName)}"></div><div class="field"><label>Operatore predefinito</label><input class="input" name="operator" value="${esc(state.settings.operator)}"></div><div class="field"><label>Tema interfaccia</label><select name="theme"><option value="light" ${state.settings.theme!=='dark'?'selected':''}>Chiaro (predefinito)</option><option value="dark" ${state.settings.theme==='dark'?'selected':''}>Scuro</option></select></div><div class="row2"><div class="field"><label>Lead time predefinito</label><input class="input" type="number" name="defaultLead" value="${int(state.settings.defaultLead,7)}"></div><div class="field"><label>Sicurezza predefinita</label><input class="input" type="number" name="safetyDays" value="${int(state.settings.safetyDays,7)}"></div></div><button class="btn">Salva impostazioni</button></form><div class="divider"></div><b>Ubicazioni gerarchiche</b><p class="info">Struttura: sede → zona → armadio → scaffale → cassetto → posizione. Ogni ubicazione può avere un QR dedicato.</p><div class="kpiList" style="margin-top:9px">${[...state.locations].sort((a,b)=>String(a.site).localeCompare(String(b.site))||locationPath(a).localeCompare(locationPath(b))).map(l=>`<div class="kpiRow"><span><b>${esc(l.code)}</b> <span class="siteTag">${esc(siteName(l.site))}</span><br><small>${esc(locationShort(l))}</small></span><span style="display:flex;gap:5px"><button class="btn secondary small" onclick="openLocationLabel('${l.id}')">QR</button><button class="btn secondary small" onclick="editLocation('${l.id}')">Modifica</button></span></div>`).join('')}</div><button class="btn secondary" style="width:100%;margin-top:9px" onclick="editLocation('')">+ Nuova ubicazione</button><div class="divider"></div><b>Backup dati</b><p class="info">I dati sono salvati nel database SQLite Android; le foto restano come file locali separati. Il backup completo è cifrato AES-256-GCM.</p><div class="row2"><button class="btn secondary" onclick="exportBackup()">Esporta backup</button><button class="btn secondary" onclick="document.getElementById('importFile').click()">Importa backup</button></div><input id="importFile" type="file" accept=".ostock,application/json" style="display:none" onchange="importBackup(this.files[0])"><button class="btn danger" style="width:100%;margin-top:10px" onclick="resetAll()">Azzera archivio</button><p class="info">Versione ${VERSION} · SQLite Android · Backup AES-256-GCM · Home scanner rapido · Tema chiaro/scuro · Rovigo + Crespino · QR articoli e ubicazioni · Inventario guidato · Gestione utensili.</p>`)}
function saveSettings(e){e.preventDefault();const f=new FormData(e.target);state.settings.shopName=String(f.get('shopName')).trim();state.settings.operator=String(f.get('operator')).trim();state.settings.theme=String(f.get('theme')||'light')==='dark'?'dark':'light';state.settings.defaultLead=int(f.get('defaultLead'),7);state.settings.safetyDays=int(f.get('safetyDays'),7);save();applyTheme();closeModal();render();toast('Impostazioni salvate')}
function editLocation(id){const l=id?locById(id):{code:'',name:'',area:'',zone:'',cabinet:'',shelf:'',drawer:'',position:'',site:'ROVIGO',notes:''};openModal(`<div class="sheetHead"><h3>${id?'Modifica ubicazione':'Nuova ubicazione'}</h3><button class="iconbtn" onclick="closeModal()">✕</button></div><form class="formgrid" onsubmit="saveLocation(event,'${id}')"><div class="row2"><div class="field"><label>Sede *</label><select name="site">${SITES.map(s=>`<option value="${s.id}" ${l.site===s.id?'selected':''}>${s.name}</option>`).join('')}</select></div><div class="field"><label>Codice *</label><input class="input" name="code" required value="${esc(l.code)}" placeholder="ROV-A01-S02-C04"></div></div><div class="row2"><div class="field"><label>Zona</label><input class="input" name="zone" value="${esc(l.zone||l.area||'')}" placeholder="Officina / Magazzino"></div><div class="field"><label>Armadio / struttura</label><input class="input" name="cabinet" value="${esc(l.cabinet||'')}" placeholder="A"></div></div><div class="row3"><div class="field"><label>Scaffale</label><input class="input" name="shelf" value="${esc(l.shelf||'')}" placeholder="2"></div><div class="field"><label>Cassetto</label><input class="input" name="drawer" value="${esc(l.drawer||'')}" placeholder="04"></div><div class="field"><label>Posizione</label><input class="input" name="position" value="${esc(l.position||'')}" placeholder="B"></div></div><div class="field"><label>Descrizione</label><input class="input" name="name" value="${esc(l.name||'')}" placeholder="Cassettiera sensori"></div><div class="field"><label>Note</label><textarea name="notes">${esc(l.notes||'')}</textarea></div><div class="actions">${id?`<button type="button" class="btn danger" onclick="deleteLocation('${id}')">Elimina</button>`:''}<button class="btn">Salva</button></div></form>`)}
function saveLocation(e,id){e.preventDefault();const f=new FormData(e.target),code=String(f.get('code')).trim();if(state.locations.some(x=>x.code.toLowerCase()===code.toLowerCase()&&x.id!==id)){toast('Codice ubicazione già esistente');return}const zone=String(f.get('zone')).trim(),d={site:String(f.get('site')),code,name:String(f.get('name')).trim(),zone,area:zone,cabinet:String(f.get('cabinet')).trim(),shelf:String(f.get('shelf')).trim(),drawer:String(f.get('drawer')).trim(),position:String(f.get('position')).trim(),notes:String(f.get('notes')).trim()};if(id){const old=locById(id);if(old.site!==d.site&&state.items.some(i=>Object.values(i.siteLocationIds||{}).includes(id))){toast('Non puoi cambiare sede: ubicazione già assegnata a un articolo');return}Object.assign(old,d)}else state.locations.push({id:uid(),...d});save();openSettings();toast('Ubicazione salvata')}
function deleteLocation(id){if(state.items.some(i=>Object.values(i.siteLocationIds||{}).includes(id))){toast('Ubicazione usata da uno o più articoli');return}if(!confirm('Eliminare questa ubicazione?'))return;state.locations=state.locations.filter(x=>x.id!==id);save();openSettings()}

function exportBackup(){const pwd=prompt('Password per cifrare il backup (minimo 8 caratteri):','');if(pwd===null)return;if(pwd.length<8){toast('Password troppo corta: usa almeno 8 caratteri');return}const raw=JSON.stringify(state);if(window.NativeBridge&&typeof NativeBridge.exportEncryptedBackup==='function'){const res=NativeBridge.exportEncryptedBackup(raw,pwd);toast(String(res||'Backup completato'));return}toast('Backup cifrato disponibile solo nell’app Android 2.7.0')}
function importBackup(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{let raw=String(r.result||'');let s;try{const e=JSON.parse(raw);if(e&&e.format==='OFFICINA_STOCK_ENCRYPTED'){const pwd=prompt('Password del backup:','');if(pwd===null)return;if(!(window.NativeBridge&&typeof NativeBridge.decryptBackup==='function'))throw new Error('Cifratura non supportata');raw=NativeBridge.decryptBackup(raw,pwd);if(String(raw).startsWith('ERR:'))throw new Error(raw);s=JSON.parse(raw)}else{s=e}}catch(inner){if(!s)s=JSON.parse(raw)}if(!Array.isArray(s.items)||!Array.isArray(s.movements)||!Array.isArray(s.locations))throw new Error('Struttura non valida');state=migrateState(s);save();closeModal();render();toast('Backup importato in SQLite')}catch(err){console.error(err);toast('Backup non valido o password errata')}finally{document.getElementById('importFile')&&(document.getElementById('importFile').value='')}};r.readAsText(file)}
function exportCSV(){let rows=[['Data','Codice','Descrizione','Tipo','Sede/Percorso','Quantità','Prima/Dopo','Macchina/Impianto','ODL','Assegnato a','Operatore','Riferimento','Nota']];[...state.movements].sort((a,b)=>new Date(a.at)-new Date(b.at)).forEach(m=>{const i=itemById(m.itemId);rows.push([m.at,i?.code||'',i?.description||'',movementTypeLabel(m),historyRoute(m),m.qty,historyBeforeAfter(m),m.machine||'',m.odl||'',m.assignee||'',m.operator||'',m.reference||'',m.note||''])});const csv=rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\n'),name=`OfficinaStock_movimenti_${new Date().toISOString().slice(0,10)}.csv`;if(window.NativeBridge&&typeof NativeBridge.saveTextFile==='function'){toast(String(NativeBridge.saveTextFile(name,'text/csv','\ufeff'+csv)||'CSV esportato'));return}downloadBlob(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),name)}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function resetAll(){if(!confirm('ATTENZIONE: cancellare articoli, movimenti e impostazioni?'))return;state=initialState();save();closeModal();render();toast('Archivio azzerato')}

async function openScanner(mode){const supports='BarcodeDetector' in window&&navigator.mediaDevices?.getUserMedia;if(!supports){toast('Scanner fotocamera non disponibile qui. Usa la ricerca manuale o un lettore barcode/QR Bluetooth.');return}const msg=mode==='countLocation'?'Inquadra il QR dell’ubicazione.':mode==='countItem'?'Inquadra il codice dell’articolo da contare.':'Inquadra il Code128 o il QR dell’etichetta.';openModal(`<div class="sheetHead"><h3>Scansiona codice</h3><button class="iconbtn" onclick="closeModal()">✕</button></div><p class="info">${msg}</p><div class="scanner open"><video id="scanVideo" autoplay playsinline muted></video><div class="scanline"></div></div><div class="field" style="margin-top:10px"><label>Oppure inserisci il codice</label><div class="searchbar"><input id="manualScan" class="input"><button class="btn small" onclick="useScan('${mode}',document.getElementById('manualScan').value)">Apri</button></div></div>`);try{ui.scannerStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});const v=document.getElementById('scanVideo');v.srcObject=ui.scannerStream;const det=new BarcodeDetector({formats:['code_128','qr_code','ean_13','ean_8','code_39']});const loop=async()=>{if(!ui.scannerStream||!document.getElementById('scanVideo'))return;try{const codes=await det.detect(v);if(codes.length){useScan(mode,codes[0].rawValue);return}}catch{}requestAnimationFrame(loop)};requestAnimationFrame(loop)}catch(e){toast('Fotocamera non autorizzata o non disponibile')}}
function stopScanner(){if(ui.scannerStream){ui.scannerStream.getTracks().forEach(t=>t.stop());ui.scannerStream=null}}
function parseScanned(raw){let code=String(raw||'').trim();if(code.toUpperCase().startsWith('OSLOC:'))return {kind:'location',code:code.slice(6).trim()};if(code.toUpperCase().startsWith('OSTOCK:'))return {kind:'item',code:code.slice(8).trim()};try{const u=new URL(code),l=u.searchParams.get('location'),i=u.searchParams.get('item');if(l)return {kind:'location',code:l.trim()};if(i)return {kind:'item',code:i.trim()}}catch{}if(state.locations.some(l=>l.code.toLowerCase()===code.toLowerCase()))return {kind:'location',code};return {kind:'item',code}}
function useScan(mode,raw){const p=parseScanned(raw);if(mode==='countLocation'){if(p.kind!=='location'){toast('Questo è un codice articolo, non una posizione');return}const l=state.locations.find(x=>x.code.toLowerCase()===p.code.toLowerCase());if(!l){toast('Ubicazione non presente in archivio');return}stopScanner();closeModal();ui.countSite=l.site;ui.countLocationId=l.id;ui.countValues={};nav('count');toast(`Posizione ${l.code} selezionata`);return}if(p.kind!=='item'){toast('Questo QR identifica una posizione');return}const i=findItemFromScan(raw);if(!i){toast('Codice non presente in archivio');return}stopScanner();closeModal();if(mode==='countItem'){const loc=locById(ui.countLocationId);if(!loc){toast('Seleziona prima una posizione');return}if(i.siteLocationIds?.[ui.countSite]!==loc.id){toast(`Articolo assegnato a ${locationShort(itemLoc(i,ui.countSite))}, non a questa posizione`);return}const val=prompt(`Quantità fisica di ${i.code} (${i.description})`,String(siteQty(i,ui.countSite)));if(val===null)return;const q=num(val,-1);if(q<0){toast('Quantità non valida');return}ui.countValues[i.id]=String(q);ui.countHighlight=i.id;nav('count');setTimeout(()=>{ui.countHighlight=''},1400);return}if(mode==='movement'){ui.selectedItem=i.id;nav('movement')}else{ui.search=i.code;nav('inventory')}}
function handleDeepLink(){try{const u=new URL(location.href),code=u.searchParams.get('item'),locCode=u.searchParams.get('location');if(locCode){const l=state.locations.find(x=>x.code.toLowerCase()===locCode.toLowerCase());if(l){ui.appMode='scan';ui.page='scanhome';render();setTimeout(()=>openScannedLocation(l),80);return}}if(!code)return;const i=state.items.find(x=>x.code.toLowerCase()===code.toLowerCase());if(i){ui.appMode='scan';ui.page='scanhome';render();setTimeout(()=>openQuickArticle(i),80)}}catch{}}

updateModeChrome();render();
setTimeout(handleDeepLink,0);
</script>
